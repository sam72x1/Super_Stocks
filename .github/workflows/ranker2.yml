name: T-RANKER2 (full-ranking arms)
permissions:
  contents: read
  actions: read          # 🕰️ لتحميل لقطة التجميد من تشغيلة freeze (frozen_run_id)
on:
  workflow_dispatch:
    inputs:
      year:
        description: "السنة (مثال 2025). **الحكم يلزمه اللقطات الثلاث** (2024 · 2025 · 2026) — تشغيلةٌ لكل سنة"
        required: true
        default: ""
      frozen_run_id:
        description: "🕰️ معرّف تشغيلة التجميد (لقطة point-in-time). **مُلزِم لإعادة الإنتاج** — §② يشترط نفس اللقطة للأذرع الخمس"
        required: false
        default: ""
      seeds:
        description: "عدد بذور `K-RAND` (شاهد الضبط). الافتراضي 200 كما سُجِّل في `ranker2_prereg.md` §③"
        required: false
        default: "200"
jobs:
  ranker2:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # السوق الكامل لسنةٍ كاملة (نفس ثقل الباكتيست)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download frozen dataset (point-in-time reproducibility)
        if: ${{ github.event.inputs.frozen_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          run-id: ${{ github.event.inputs.frozen_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run full-ranking arms
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ⚠️ `SCREENER_MODE` و`BT_REPLAY10` و`BT_ENVVALS` و`BT_POTENTIAL` يضبطها
          # السكربت **قبل الاستيراد** — الضبط هنا يصل متأخّرًا (بصمة الـno-op).
          BACKTEST_YEAR: ${{ github.event.inputs.year }}
          R2_SEEDS: ${{ github.event.inputs.seeds }}
          # 🕰️ التجميد: لو frozen_run_id مُعطى → حُمِّلت اللقطة، فاقرأها
          BT_FROZEN_PATH: ${{ github.event.inputs.frozen_run_id != '' && 'frozen_backtest.pkl.gz' || '' }}
        run: python ranker2_arms.py
      - name: Upload backtest CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranker2-report
          path: backtest_*.csv
          if-no-files-found: ignore
