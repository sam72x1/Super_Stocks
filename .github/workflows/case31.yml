name: "🗂️🔬 T-CASE31 — الملف الجنائي لمنفجري الشهر (قراءةٌ وتحليل · بلا تلغرام)"

# أمرُ المالك 2026-11-20 «T-CASE31 — الملف الجنائي لمنفجري الشهر» · العقد fm_forensics/case31/T_CASE31_prereg.md · قراءةٌ وتحليلٌ فقط.
# يدويٌّ بلا كرون · لا تلغرام · لا Polygon · المخرجاتُ بياناتٌ تحت fm_forensics/case31/out/ يودعها هذا الـworkflow (بياناتٌ لا كود · سابقةُ blindpick.yml).
permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "verify (⓪ التحقّق من القائمة وإكمالُها وأنواعُ الانفجار)"
        required: true
        default: "verify"

concurrency:
  group: super-stocks-case31
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ inputs.stage == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # لقطاتُ git اليوميّة لـ«تحت المتابعة»
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip
      - run: pip install -r requirements.txt
      - name: 🗂️ ⓪ التحقّق
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python fm_forensics/case31/case31.py verify | tee case31_verify.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case31-verify
          path: |
            fm_forensics/case31/out/
            case31_verify.log
          retention-days: 90
      - name: 💾 إيداعُ المخرجات (بياناتٌ لا كود)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fm_forensics/case31/out
          if git diff --cached --quiet; then echo "لا جديد"; exit 0; fi
          git commit -q -m "🗂️ T-CASE31 بيانات: ${{ inputs.stage }}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin "$GITHUB_REF_NAME" && git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
            sleep 5
          done
          exit 1
