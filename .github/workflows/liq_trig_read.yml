name: Liq Trigger Read (🚦📜 قراءةُ الزناد الموازي)

# قراءةٌ فقط — تمشي تاريخَ `op_entry_state.json` وتُحصي مراسي الزناد الموازي.
# يدويّةٌ بلا كرون: تُشغَّل حين يسأل المالكُ «اقرأ الزناد» لا كلَّ يوم.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "المرجعُ الذي يُقرأ تاريخُه (الافتراض origin/main)"
        required: false
        default: "origin/main"
      limit:
        description: "سقفُ المراجعات (0 = الكلّ)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # التاريخُ كاملًا — بلا عمقٍ لا لقطاتِ حالة
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 🚦📜 اقرأ الزناد
        env:
          TRIG_READ_REF: ${{ inputs.ref }}
          TRIG_READ_LIMIT: ${{ inputs.limit }}
        run: python3 liq_trig_read.py
