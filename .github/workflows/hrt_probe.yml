name: "🏦 مِجَسّ بيانات HRT (مؤقّت · يُحذف بعد القراءة)"

# 🔒 قراءةٌ فقط — لا كرون · لا كتابة حالة · لا تلغرام · لا Polygon.
# 🔑 السرُّ الوحيد `SEC_CONTACT` = هويّةُ الوكيل لدى SEC (غائبٌ ⇒ الوكيلُ الاحتياطيّ نفسُه في البوت).
# ⏳ مؤقّت: يُحذف مع `hrt_probe.py` بعد كتابة مُخرَجه في الحزمة (أمرُ المالك «سجّل HRT» 2026-09-23 · U-15)
#    — ويعمل على فرع التطوير وحده (لا يصل `main`).
permissions:
  contents: read

on:
  push:
    branches: [claude/conversation-compaction-failure-088pki]
    paths:
      - hrt_probe.py
      - .github/workflows/hrt_probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🏦 المِجَسّ
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python hrt_probe.py
