name: "🎯🔎 مصير تنبيهات هنا الدخول (قراءة فقط · مؤقّت)"

# 🔒 قراءةٌ فقط — لا كرون · لا كتابة حالة · لا تلغرام · أداةٌ مؤقّتة لتقرير أ (أمرُ المالك 2026-10-28) تُحذف بعد القراءة.
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  op-fate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🎯 المصير
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python op_alert_fate.py
