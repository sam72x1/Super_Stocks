name: Method Hunter (النهج العلمي — فيصل)

# 🔐 أقلّ صلاحية (تدقيق 2026-07-28، خطة `plans/010`): كان `contents: read` لأن الصيّاد
# **لا يحفظ شيئًا**. 🔴 تغيّر بالبند ⓿-و (2026-07-31): صار يكتب **ختم آخر مسحٍ ناجح**
# (`split_hunter_stamp.json` — حقلٌ واحد: تاريخ الجلسة) ويدفعه بـ`git_save`، ليقرأه
# المسار اليومي فيكشف سقوط هذا الكرون بدل أن يُقرأ صمتُه «لا مقسّم اليوم».
# ⚠️ تضييقها إلى `read` يُفشِل الدفع صامتًا ⇒ الختم يتقادم ⇒ **تحذيرٌ يوميّ كاذب**.
permissions:
  contents: write
# 🪝 أداة مستقلة عن فارز الارتكاز: تمسح ناسداك بعد الإغلاق عن مقسّم عكسي يطابق setup
# فيصل الصارم (مقسّم + وصل القمة÷2 + حافظ 3ج + فلوت<2م + خالٍ من قروب) وترسله لتلغرام.
# صامتة لو لا مطابق. عرض/تنبيه فقط — لا تمسّ حالة/فرز/LOGIC_VERSION.
on:
  schedule:
    # ⏰ **بعد إغلاق الافتر · وأبكر ما يصحّ** (طلب المالك 2026-07-31: «~3 فجرًا
    # بتوقيت السعودية»). ‏3 فجرًا = **00:00 UTC** — وهي **بالضبط** إغلاق الافتر
    # **صيفًا** (‏20:00 ET = 00:00 UTC بـEDT)، **لكنها قبله بساعةٍ شتاءً** (‏EST ⇒
    # الإغلاق 01:00 UTC). فكرونٌ واحد عند 00:13 كان سيُعيدنا **داخل الافتر شتاءً** —
    # وهو **العيب نفسه** الذي أُصلح في 2026-07-27 (‏22:17 UTC = 18:17 ET).
    #
    # ⇒ **كرونان، و`session_gate` تحسم أيّهما يعمل** بقراءة ساعة نيويورك (فتصيب
    #   الفصلين ذاتيًّا بلا جدولٍ يدويّ): ما قبل 20:00 ET **لا يمسح**.
    #   · صيفًا: ‏00:13 = 20:13 ET ✅ **يمسح (‏03:13 السعودية = طلب المالك)** ·
    #     و01:13 = 21:13 ET يجده مُسِح فيصمت (دِدوب الختم).
    #   · شتاءً: ‏00:13 = 19:13 ET ⛔ **لا يمسح** · و01:13 = 20:13 ET ✅ يمسح.
    # ⚠️ خانة الأيام **2-6 (ثلاثاء→سبت)** لا 1-5: جلسة الاثنين ET ينتهي افترها فجر
    #    الثلاثاء UTC، وجلسة الجمعة فجر السبت UTC. تغييرها معًا إلزامي.
    # دقيقة غير مستديرة (13) تقلّل تأخّر GitHub الموثّق (التأخّر يؤجّل فقط ولا يُبكّر،
    # فلا يعيدنا داخل الافتر — والبوّابة تحرسه على أي حال).
    - cron: "37 0 * * 2-6"
    - cron: "37 1 * * 2-6"
  workflow_dispatch: {}
jobs:
  method-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run split hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 📄 SEC تطلب بريد تواصل حقيقي بالـUser-Agent. الشرط ① صار يقبل «طرح جديد»
          # حدثًا مؤسِّسًا (`_offering_event`) وهو يضرب data.sec.gov — وبلا هذا السرّ
          # يرتدّ الـUA إلى contact@example.com فقد يُبطَّأ/يُحجَب بسياسة الوصول العادل.
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          # 🌙⛔ حارس الافتر (AH-GUARD): شمعة ياهو اليومية **لا تشمل الافتر** والصيّاد
          # يُسلّم بعده ⇒ بلا هذا المفتاح لا يُقرأ السعر الممتد، فيمرّ التنبيه البائت
          # (واقعة NUWE 2026-07-30). الغياب **فاشل-آمن مفتوح**: يُرسَل موسومًا «لم
          # يُتحقّق من سعر الافتر» — لا كتم صامت، لكن الوسم يعني أننا عميان فعلًا.
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          # 🔓 التشغيل اليدويّ يتخطّى بوّابة التوقيت والدِدوب معًا. بدونه كان الفحص
          # الفوريّ نهارًا **يخرج صامتًا بصفر عمل** (البوّابة تُرجعه) — وهو بالضبط
          # صنفُ «أخضرَ بلا رسالة» الذي بُني كل حارسٍ هنا ضدّه.
          METHOD_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python method_hunter.py
