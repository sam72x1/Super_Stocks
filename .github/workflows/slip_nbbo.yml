name: 📡🩸 T-SLIP-NBBO — الانزلاق على العرض القائم
# العقد: slip_nbbo_prereg.md (مدفوع قبل أي سطر من الأداة).
# بحث/قياس فقط · يدويّ بلا كرون · صفر مسّ إنتاج · سقف النجاح اقتراح للمالك.
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      year:
        description: "السنة (2023 · 2024 · 2025) — الحكم يلزمه الثلاث"
        required: true
        default: ""
      frozen_run_id:
        description: "لقطة PIT: 2023=31574165523 · 2024=31199493957 · 2025=31191327731"
        required: true
        default: ""
jobs:
  slip_nbbo:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          run-id: ${{ github.event.inputs.frozen_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run slip nbbo arms
        env:
          BACKTEST_YEAR: ${{ github.event.inputs.year }}
          BT_FROZEN_PATH: frozen_backtest.pkl.gz
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python slip_nbbo_arms.py
      - name: Upload nbbo events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slip-nbbo-events-${{ github.event.inputs.year }}
          path: slip_nbbo_events.jsonl
          retention-days: 90
