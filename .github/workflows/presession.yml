name: "T-PRESESSION (🌙⏱️ قائمةٌ قبل الافتر/البري بعشر دقائق)"

# 🔒 قياس/قراءة فقط — لا كرون · لا كتابة حالة · لا تلغرام · العقد presession_prereg.md
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      year:
        description: "السنة المقيسة (2023/2024/2025/2026)"
        required: false
        type: string
      day:
        description: "يومٌ واحد للدخان (YYYY-MM-DD — يتقدّم على السنة)"
        required: false
        type: string
      end:
        description: "آخرُ يومٍ للسنة الجزئيّة (YYYY-MM-DD — فارغٌ = السنةُ كاملةً)"
        required: false
        type: string
      syms:
        description: "رموزٌ تُطبَع رتبتُها في وضع اليوم الواحد (بفواصل)"
        required: false
        type: string
      witness:
        description: "شاهدُ الضبط (افتراضه AAPL — يجب ألّا ينفجر)"
        required: false
        type: string

jobs:
  presession:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🌙 قِس ما قبل الجلسة الممتدّة
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.POLYGON_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.POLYGON_S3_SECRET }}
          PRESESSION_YEAR: ${{ inputs.year }}
          PRESESSION_DAY: ${{ inputs.day }}
          # 🔒 كلُّ مدخلٍ موصولٌ ببيئةٍ يقرؤها السكربت (بصمةُ `BT_CANDLE`)
          PRESESSION_END: ${{ inputs.end }}
          PRESESSION_SYMS: ${{ inputs.syms }}
          PRESESSION_WITNESS: ${{ inputs.witness }}
        run: python presession_scan.py

      - name: 📤 رفع الصفوف
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presession-rows-${{ inputs.year || inputs.day }}
          path: presession_rows_*.jsonl.gz
          retention-days: 90
          if-no-files-found: warn
