name: T-STABILITY (ثبات الدعم 3 جلسات بوّابةَ رفض)

# 🧱🕯️ يقيس: كلفةُ إنفاذ قاعدة فيصل «حافظ ع قاعه لمدة 3 جلسات» بوّابةَ رفض.
#    العقد: `stability_prereg.md` (مدفوعٌ قبل أيّ رقم · حرّاسُ V1-V6).
# ⛔ ولا ذراعَ للسقف `STABILITY_MAX`=8 (‏`engineering`) — مقفولٌ `ST5`.
# 🔒 بحث/قياس فقط · بلا كرون · والعلمُ مطفأٌ افتراضيًّا فالإنتاجُ بت-بت.
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      year:
        description: "السنة (2024 · 2025 · 2026) — الحكم يلزمه الثلاث"
        required: true
        default: ""
      frozen_run_id:
        description: "لقطة PIT: 2024=31199493957 · 2025=31191327731 · 2026=31199510868"
        required: true
        default: ""
      probe_syms:
        description: "رموزُ المِجَسّ التشخيصيّ (الحارس د) — فارغ = BBLG"
        required: false
        default: ""
jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # 🧊 خطة 025
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download frozen dataset
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          run-id: ${{ github.event.inputs.frozen_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run stability arms
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKTEST_YEAR: ${{ github.event.inputs.year }}
          BT_FROZEN_PATH: frozen_backtest.pkl.gz
          # 🔴 مدخلٌ بلا `env` = مدخلٌ ميّت (بصمةُ `BT_CANDLE`) — مقفولٌ `ST7`.
          STAB_PROBE_SYMS: ${{ github.event.inputs.probe_syms }}
        run: python stability_arms.py
