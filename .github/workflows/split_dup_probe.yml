name: "🧹 مِجَسّ مكرّر التقسيم (مؤقّت · يُحذف بعد القراءة)"

# 🔒 قراءةٌ فقط — لا كرون · لا كتابة حالة · لا تلغرام · لا Polygon · لا أسرار.
# ⏳ مؤقّت: يُحذف مع `split_dup_probe.py` بعد كتابة مُخرَجه في الحزمة (أمرُ المالك «احذف المكرّر في عدّ التقسيم» 2026-09-23)
#    — ويعمل على فرع التطوير وحده (لا يصل `main`).
permissions:
  contents: read

on:
  push:
    branches: [claude/conversation-compaction-failure-088pki]
    paths:
      - split_dup_probe.py
      - .github/workflows/split_dup_probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🧹 المِجَسّ
        run: python split_dup_probe.py
