name: T-REPLAY10 (faithful replay arms)
permissions:
  contents: read
  actions: read          # 🕰️ لتحميل لقطة التجميد من تشغيلة freeze (frozen_run_id)
on:
  workflow_dispatch:
    inputs:
      year:
        description: "السنة (مثال 2025) — السنة كاملة بتشغيل واحد. **إلزامية عمليًّا**: الحكم يلزمه ثلاث سنوات (2023 · 2024 · 2025)"
        required: true
        default: ""
      frozen_run_id:
        description: "🕰️ معرّف تشغيلة التجميد (لقطة point-in-time). **مُلزِم لإعادة الإنتاج** — التسجيل المسبق ثبّت اللقطة 30598885456"
        required: false
        default: ""
      seeds:
        description: "عدد بذور الذراع R2 (توزيع العدم). الافتراضي 10000 كما سُجِّل — لا يُخفَّض إلا لتجربة سريعة"
        required: false
        default: "10000"
jobs:
  replay10:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # السوق الكامل لسنةٍ كاملة (نفس ثقل الباكتيست)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download frozen dataset (point-in-time reproducibility)
        if: ${{ github.event.inputs.frozen_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          run-id: ${{ github.event.inputs.frozen_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run replay arms
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ⚠️ `SCREENER_MODE` و`BT_REPLAY10` يضبطهما السكربت **قبل الاستيراد** —
          # لأن `_apply_backtest_overrides` يُنفَّذ وقت تحميل الوحدة، فالضبط هنا
          # كافٍ لكنه يُترك للسكربت ليبقى تشغيله اليدويّ مطابقًا لتشغيل الـworkflow.
          BACKTEST_YEAR: ${{ github.event.inputs.year }}
          REPLAY10_SEEDS: ${{ github.event.inputs.seeds }}
          # 🕰️ التجميد: لو frozen_run_id مُعطى → حُمِّلت اللقطة، فاقرأها
          BT_FROZEN_PATH: ${{ github.event.inputs.frozen_run_id != '' && 'frozen_backtest.pkl.gz' || '' }}
        run: python replay10_arms.py
      - name: Upload backtest CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay10-report
          path: backtest_*.csv
          if-no-files-found: ignore
