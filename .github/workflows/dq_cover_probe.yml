name: dq cover probe (مؤقّت — يُحذف قبل الدمج)

# 🛡️🔎 تغطيةُ سلامة البيانات على الأدوات غير الموصولة — قراءةٌ فقط: بلا تلغرام ولا كتابة حالة ولا Polygon ولا git.
# المعاييرُ D1-D5 في رأس dq_cover_probe.py مكتوبةٌ قبل أوّل تشغيل.
on:
  pull_request:
    paths:
      - "dq_cover_probe.py"
      - ".github/workflows/dq_cover_probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python dq_cover_probe.py
