name: 🩸📏 T-SLIP — قياس الانزلاق الحقيقي على الوقف

# العقد: slip_prereg.md (مدفوع قبل سطر واحد من الأداة).
# بحث/قياس فقط · يدوي بلا كرون · صفر مسّ إنتاج · سقف النجاح اقتراح للمالك.
# 🔴 كل مدخل موصول ببيئة يقرؤها السكربت (قاعدة P1 — لا مدخل ميت).
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      year:
        description: "السنة (2023 · 2024 · 2025) — الحكم يلزمه الثلاث"
        required: true
        default: ""
      frozen_run_id:
        description: "لقطة PIT: 2023=31574165523 · 2024=31199493957 · 2025=31191327731"
        required: true
        default: ""
jobs:
  slip:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download frozen dataset
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          run-id: ${{ github.event.inputs.frozen_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run slip arms
        env:
          BACKTEST_YEAR: ${{ github.event.inputs.year }}
          BT_FROZEN_PATH: frozen_backtest.pkl.gz
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python slip_arms.py
      - name: Upload slip events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slip-events-${{ github.event.inputs.year }}
          path: slip_events.jsonl
          if-no-files-found: warn
          retention-days: 90
