name: "🔎 مِجَسّ الشروط الثلاثة (مؤقّت · يُحذف بعد القراءة)"

# 🔒 قراءة/قياس فقط — لا كرون · لا كتابة حالة · لا commit · لا تلغرام (لا سرَّ له هنا).
#    كونُ البوت كلُّه ⟵ RSI أقلّ من 30 · فلوت أقلّ من 4م · متاح أقلّ من 20 ألفًا · فوق الدولار (تعريفاتُ watch_week_probe بالاسم).
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      xcheck:
        description: "رموزٌ بفاصلة للمقارنة المستقلّة ياهو/Polygon (فارغ = المِجَسّ الكامل)"
        required: false
        default: ""
      mode:
        description: "audit = فحصُ البوت (ياهو مقابل Polygon على الكون كلّه)"
        required: false
        default: ""

jobs:
  three_cond_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🔎 المِجَسّ
        env:
          PYTHONUNBUFFERED: "1"
          XCHECK: ${{ github.event.inputs.xcheck }}
          MODE: ${{ github.event.inputs.mode }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python three_cond_probe.py
