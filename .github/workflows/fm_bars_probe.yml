name: "🔎📺 FM-PROBE — شموعُ TradingView لتحقيق READY NOW (قراءةٌ فقط)"

# 🔒 مِجَسٌّ مؤقّت للمهمّة الجنائيّة (2026-10-08): لا كرون · لا تلغرام · لا أسرار · لا حالةَ إنتاج — يكتب ملفًّا مضغوطًا في
#    fm_forensics/data/ على الفرع الذي شُغِّل منه. يُحذف بعد انتهاء المهمّة.
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      start:
        description: "بدايةُ الشموع اليوميّة (YYYY-MM-DD)"
        required: false
        default: "2025-01-01"

concurrency:
  group: fm-bars-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: 📺 جلب الشموع
        env:
          FM_START: ${{ github.event.inputs.start }}
          BARS_SOURCE: tradingview
          FAISAL_ONLY: "1"
        run: python fm_forensics/fm_bars_probe.py
      - name: 💾 دفع الملفّ للفرع
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fm_forensics/data/*.json.gz
          git commit -m "🔎📺 FM-PROBE: شموع TradingView للتحقيق (قراءة فقط)" || echo "لا تغيير"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
