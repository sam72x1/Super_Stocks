name: 🎯🧮 T-T1MOVE — الحكمُ المجمَّع (السنوات الثلاث في تشغيلةٍ واحدة)
# العقد: t1move_prereg.md §④ (مدفوعٌ قبل أيّ رقم).
# ⚖️ ميزانيةٌ واحدةٌ بالبناء: السنواتُ الثلاث بنفس الكود ونفس السقوف في تشغيلةٍ
#    واحدة ⇒ الفاصلُ المجمَّع بعنقود **الرمز عبر السنوات** كما فعلت `T-TRANCHE`.
# بحث/قياس فقط · يدويّ بلا كرون · صفر مسّ إنتاج (Super_stock.py لا يُمَسّ).
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      snap_2023:
        description: "لقطة PIT لسنة 2023"
        required: true
        default: "31574165523"
      snap_2024:
        description: "لقطة PIT لسنة 2024"
        required: true
        default: "31199493957"
      snap_2025:
        description: "لقطة PIT لسنة 2025"
        required: true
        default: "31191327731"
jobs:
  t1move-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          path: snap2023
          run-id: ${{ github.event.inputs.snap_2023 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          path: snap2024
          run-id: ${{ github.event.inputs.snap_2024 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          path: snap2025
          run-id: ${{ github.event.inputs.snap_2025 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run t1move pooled
        env:
          T1MOVE_POOL: >-
            2023:snap2023/frozen_backtest.pkl.gz,2024:snap2024/frozen_backtest.pkl.gz,2025:snap2025/frozen_backtest.pkl.gz
        run: python t1move_arms.py
