name: T-ANCHOR-AGE bars (بحثٌ فقط · مؤقّت · لا تلغرام)

# 📺 يجلب شموعَ TradingView اليوميّة لرموز T-ANCHOR-AGE (fm_forensics/anchor_age/data/fetch_symbols.json) ويلتزمها في فرعه.
#    يعمل بالدفع إلى فرعه وحدَه (claude/anchor-age-fetch) · لا يُدمَج في main · يُحذَف بعد القياس.
permissions:
  contents: write

on:
  push:
    branches: [claude/anchor-age-fetch]
    paths:
      - .github/workflows/anchor_age_fetch.yml
      - fm_forensics/anchor_age/anchor_fetch.py
      - fm_forensics/anchor_age/data/fetch_symbols.json

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch
        run: python3 fm_forensics/anchor_age/anchor_fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fm_forensics/anchor_age/data/anchor_bars.json.gz
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "📺 T-ANCHOR-AGE bars: run ${{ github.run_id }}"
          for i in 1 2 3 4; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0; sleep $((i*5)); done
          exit 1
