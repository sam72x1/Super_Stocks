name: tvs probe (مؤقّت — يُحذف قبل الدمج)

# 🧪 التقسيماتُ غيرُ المسوّاة في شموع TradingView (مسارُ الإنتاج `tv_download`) — قراءةٌ فقط: بلا تلغرام ولا كتابة حالة ولا Polygon.
on:
  pull_request:
    paths:
      - "tvs_probe.py"
      - ".github/workflows/tvs_probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        run: python tvs_probe.py
