name: Volume Baseline Arms (📏🔊 مرجعُ الحجم — T-VOLBASE)

# 🔒 **قراءةٌ/قياسٌ فقط**: لا كرون · لا كتابةَ حالة · لا رسالة تلغرام · لا مسَّ فرزٍ.
# ⛔ **ولا ابتلاعَ فشل**: خروج 2 (لا بيانات) · 3 (قفلٌ ساقط أو `V0` تفرّق) ·
#    4 (‏`no-op`) · 5 (صفرُ حدث) — **كلُّها تُرى حمراء**.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      day:
        description: "الجلسةُ المقيسة YYYY-MM-DD (فارغٌ = آخرُ جلسةٍ فيها بيانات)"
        required: false
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 📏🔊 قِس مرجعَ الحجم
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          GATE_DAY: ${{ inputs.day }}
        run: python volbase_arms.py
