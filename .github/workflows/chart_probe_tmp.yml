name: "🔎 مِجَسٌّ مؤقّت — مُعرِّف الشارت على بطاقتَي المالك (يُحذف قبل الدمج)"

# 🔒 قراءةٌ فقط — يعمل على فرع التطوير وحدَه (لا main) · لا تلغرام · لا كتابة حالة.
#    الغرض: أوّلُ جوابٍ للمالك على صورتَي 2026-09-24 قبل اكتمال الأداة ودمجها.
permissions:
  contents: read

on:
  push:
    branches: [claude/conversation-compaction-failure-088pki]
    paths:
      - "chart_cards/live/**"
      - "chart_finder.py"
      - ".github/workflows/chart_probe_tmp.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🔎 مُعرِّف الشارت
        env:
          PYTHONUNBUFFERED: "1"
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.POLYGON_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.POLYGON_S3_SECRET }}
          CHART_CARD_FILES: "chart_cards/live/2026-09-24_A.json,chart_cards/live/2026-09-24_B.json,chart_cards/live/2026-09-24_B_alone.json"
        run: python chart_finder.py
