name: M0 Probe (🚨🔬 هل إشعارُ ما قبل الإغلاق يستحقّ خطرَه؟)

# 🔒 **قراءةٌ/قياسٌ فقط**: لا كرون · لا كتابةَ حالة · لا رسالة تلغرام · لا مسَّ فرزٍ.
# ⛔ **ولا `continue-on-error`**: خروج 3 (قفلٌ ساقط) و4 (لا شموعَ ثانية) و5 (لا مادّة)
#    **يجب أن تُرى حمراء** — عقدُ `m0_prereg.md §②`.
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🚨🔬 قِس M0 بشموع الثانية
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python m0_probe.py
