name: artifact probe (مؤقّت — يُحذف قبل الدمج)

# 🔎 PHASE A (FAISAL MASTER FORENSIC RECOVERY): صورُ الـartifacts الحيّة مقابل المستودع — قراءةٌ فقط:
# بلا تلغرام ولا كتابة حالة ولا git ولا رفع artifact. السكربت faisal_recovery/artifact_probe.py.
on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install Pillow==12.3.0 numpy==2.4.6
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python faisal_recovery/artifact_probe.py
