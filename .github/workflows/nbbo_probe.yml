name: 📡🩺 مِجَسّ جدوى NBBO — تشخيص فقط
# مِجَسّ جدوى لا تجربة حكم ⇒ بلا تسجيل مسبق وبسقف نجاح صفر (سابقة
# nbbo_history_verdict / flatfiles_probe). يدويّ · بلا كرون · صفر مسّ إنتاج.
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      year:
        description: "السنة (2023 · 2024 · 2025)"
        required: true
        default: "2025"
      frozen_run_id:
        description: "لقطة PIT: 2023=31574165523 · 2024=31199493957 · 2025=31191327731"
        required: true
        default: "31191327731"
jobs:
  nbbo_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          run-id: ${{ github.event.inputs.frozen_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run NBBO feasibility probe
        env:
          BACKTEST_YEAR: ${{ github.event.inputs.year }}
          BT_FROZEN_PATH: frozen_backtest.pkl.gz
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python nbbo_probe.py
