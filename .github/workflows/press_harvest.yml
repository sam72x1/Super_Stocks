name: Press Harvest (حاصِد قناة الضغط)

# 📒 يقرأ `press_radar_ledger.jsonl` ويحسم صفوفَه بدوالّ الإنتاج — **قراءةٌ لا حكم**.
# ⏰ كرونٌ ليليٌّ بأمر المالك (2026-08-29 «سو كرون للحصاد»): يعمل **بعد** رادار
#    الضغط (كرونا `25 0` و`25 1`) فيجد ختمَ الليلة مكتوبًا، وبتأخّر GitHub
#    المتغيّر (‏24-609 دقيقة مقيسًا) يبقى آمنًا: **قراءةٌ فقط · بلا حالةٍ ولا
#    تلغرام · وحكمُه «لا حكم» دائمًا** ⇒ التأخّرُ يؤجّل ولا يُفسد.
#    والأيامُ `2-6` لأن الرادارَ نفسَه عليها (جلسةُ الاثنين تُحصَد الثلاثاء).

# قراءةٌ فقط — لا يكتب في المستودع ولا يدفع شيئًا
permissions:
  contents: read

on:
  workflow_dispatch: {}
  schedule:
    - cron: "43 2 * * 2-6"

concurrency:
  group: super-stocks-press-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve pressure ledger
        env:
          PYTHONUNBUFFERED: "1"      # 🐞 درسٌ مقيس: بلا هذا يضيع المُخرَجُ عند أيّ قتل
        run: python press_harvest.py
