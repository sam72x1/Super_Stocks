name: aht probe (مؤقّت — يُحذف قبل الدمج)

# 🧪 حارسُ الافتر للمقسّم على TradingView مقابل ياهو — قراءةٌ فقط: بلا تلغرام ولا كتابة حالة ولا git. المعيارُ في رأس aht_probe.py.
on:
  pull_request:
    paths:
      - "aht_probe.py"
      - ".github/workflows/aht_probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
        run: python aht_probe.py
