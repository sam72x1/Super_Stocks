name: Daily Pivot Screener
permissions:
  contents: write
concurrency:
  # مجموعة مشتركة مع pullback_monitor: كلاهما يكتب weekly_watchlist.json،
  # فلا يعملان متزامنَين (يمنع تضارب git_save وفقدان حالة «triggered»).
  #
  # 🔴 **استثناءُ التشغيل اليدويّ (2026-08-06 — عطلٌ مقيس):** المراقبُ يعمل أربع مرّات
  #    بالساعة (‏`13,43` و`28,58`)، وGitHub **يُبقي معلَّقًا واحدًا فقط** لكل مجموعة
  #    ⇒ أيُّ تشغيلٍ يدويٍّ للفرز يُطرَد بأوّل كرون مراقبٍ يليه. المقيس اليوم:
  #    تشغيلةُ المالك انتظرت **‏84 دقيقة**، والتالية **أُلغيت** بعد 15 دقيقةً من بدئها.
  # ⚖️ **ولماذا الاستثناءُ آمن؟** ① الكرونُ اليوميّ `54 4` **خارج نافذة المراقب**
  #    (‏11-23) فلا يتماسّان أصلًا · ② والتجديدُ `7 22 * * 5` **داخلها** فيبقى في
  #    المجموعة كما هو · ③ و`git_save` **يحلّ التعارضَ فعلًا** (يعتمد الريموت ثم يعيد
  #    كتابة ملفاتنا فوقه) — **وهذي سابقةٌ مدوَّنةٌ في docstring‌ه**: `ignition.yml`
  #    أُخرج عمدًا من المجموعة «لأن الاسترجاع يحلّ تعارضه بلا قتل التوازي المقصود»
  #    · ④ والتشغيلُ اليدويّ يكون بـ`force_renew` غالبًا وهو **يعيد بناء القائمة
  #    أصلًا**، ففقدُ وسمِ «triggered» أثرُ الأمر نفسِه لا انحدارٌ جديد.
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('super-stocks-manual-{0}', github.run_id)
        || 'super-stocks-state' }}
  cancel-in-progress: false
on:
  schedule:
    # متابعة يومية: الثلاثاء→الجمعة (تقرأ إغلاق الاثنين→الخميس).
    # 🔴 **تصحيح مقاس 2026-07-28:** كان مكتوبًا هنا أن الدقيقة غير المستديرة «تقلّل
    #    التأخير جوهريًّا». **القياس ينفيه:** بالدقيقة 23 ظلّ التأخّر **138-159 دقيقة**
    #    (بدء فعليّ 09:41-10:01 UTC) ⇒ التقرير يصل **12:41-13:01 السعودية** لا 10ص.
    #    فالدقيقة غير المستديرة **ليست** العلاج — العلاج **تقديم الكرون بمقدار التأخّر
    #    المقيس**، تمامًا كما عولج رادار الانطلاق في نفس اليوم.
    #    04:54 + (138..159) = 07:12-07:33 UTC = **10:12-10:33 السعودية** ✓
    # ✅ **تحقّق بالبيانات 2026-07-28/29 (`plans/012-findings.md`، 22 تشغيلة مجدولة):**
    #    الإصلاح يعمل — لكن هذا **بدء الجوب** لا **وصول التقرير**، والمدى أضيق من المقيس:
    #    تأخّر GitHub الفعلي **112-195د (وسيط 149)** · ومدّة التشغيل **8.1د وسيطًا**
    #    ⇒ **وصول التقرير ≈ 10:33 السعودية وسيطًا، بمدى 09:57-11:17.**
    #    ولو زال تأخّر GitHub يومًا فالبدء 04:54 UTC (07:54 السعودية) — أبكر وغير ضارّ:
    #    تقرير ما قبل السوق (الافتتاح الأمريكي 16:30 السعودية) وبيانات إغلاق الأمس جاهزة.
    #
    # 🔴🔴 **إعادةُ معايرةٍ مقيسة 2026-09-04 (أمرُ المالك «تقديمُ كرون التقرير اليوميّ»):**
    #    السطرُ أعلاه بائتٌ ماديًّا — تأخّرُ GitHub **تضاعف**. من سجلّ هذا الـworkflow
    #    نفسِه على الكرون `54 4`: **286 · 257 · 265 · 258 دقيقة** (09-01 · 09-02 ·
    #    09-03 · 09-04) بوسيطٍ **≈261** ⇒ البدءُ الفعليّ 09:11-09:40 UTC ومدّةُ التشغيل
    #    12-15 دقيقة ⇒ **وصولُ التقرير ≈12:23-12:55 السعودية لا 10:33.**
    #    العلاجُ نفسُه المدوَّن أعلاه: **تقديمُ الكرون بمقدار التأخّر المقيس**
    #    ⇒ 02:41 + (257..286) = 06:58-07:27 UTC + التشغيل ⇒ **≈10:10-10:42 السعودية** ✓
    # ⚠️ **والتأخّرُ متقلّبٌ لا ثابت** (26-31 دقيقةً منتصفَ أغسطس · 666-731 يومَي
    #    08-27/08-28) ⇒ لا يُوعَد المالكُ بدقيقةٍ بعينها. لكنّ التقديمَ **يُحسّن
    #    الطرفين معًا**: لو زال التأخّرُ فالوصول ≈06:1x السعودية (تقريرُ ما قبل السوق،
    #    غيرُ ضارّ — الافتتاح 16:30) · ولو عاد إلى 700 دقيقةً فالوصول ≈17:2x بدل 19:3x.
    # 🔒 **وخارج نافذة مراقب الارتداد كما كان** (نوافذه 8-23 و`13 0,2,4,6`): الدقيقةُ 41
    #    تبعد 28 دقيقةً عن كرون المراقب `13 2`، ومدّةُ المراقب 0.6 دقيقةً وسيطًا.
    - cron: "41 2 * * 2-5"
    # 🔄 التجديد الأسبوعي: الجمعة ~22:07 UTC = بعد إغلاق السوق الأمريكي
    #    (20:00 صيفًا / 21:00 شتاءً UTC) → شمعة أسبوعية مكتملة (اثنين→جمعة).
    #    الدقيقة 7 = نفس علاج الزحمة. التأخير لو حصل لا يضر (بعد الإغلاق بأي حال).
    #    ⚠️ لو غيّرت هذا الوقت، غيّر مطابقته في RENEW_ON_CLOSE أدناه.
    - cron: "7 22 * * 5"
  workflow_dispatch:
    inputs:
      force_renew:
        description: "إعادة بناء القائمة كاملة على آخر كود (1=نعم)"
        required: false
        default: "0"
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # 🧊 خطة 025
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 14ج: بريد تواصل حقيقي لطلبات SEC (أضف سرّ SEC_CONTACT بصيغة
          # «Bot/1.0 (email@example.com)») — فارغ = الافتراضي القديم.
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          # 🌙 **أُضيف 2026-07-27:** `enrich` يملأ `session_ctx.pre_after` من Polygon
          # عند وجود المفتاح داخل نافذة 08:00–13:30 UTC، وإلا يبقى فارغًا بسببٍ صريح.
          # الكرون 07:23 خارج النافذة **نظريًّا**، لكن تأخّر GitHub الموثّق (2.2–3.6س)
          # يضع التشغيل الفعلي غالبًا **داخلها** — فكان الحقل يبقى فارغًا بلا داعٍ.
          # فاشل-آمن: غياب السرّ = السلوك السابق حرفيًّا · و`polygon_premarket` تفحص
          # الوقت **قبل** الشبكة فصفر نداء مهدور خارج النافذة.
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SCREENER_MODE: FULL
          FORCE_RENEW: ${{ github.event.inputs.force_renew }}
          # 🔄 إشارة التجديد الأسبوعي: تُرفع فقط في جوب كرون الجمعة 22:07 UTC
          #    (بعد إغلاق السوق). أي تشغيل آخر (متابعة يومية/يدوي) = 0.
          #    ⚠️ النص هنا يطابق سطر الكرون أعلاه حرفيًّا — غيّرهما معًا.
          RENEW_ON_CLOSE: ${{ github.event.schedule == '7 22 * * 5' && '1' || '0' }}
        run: python Super_stock.py
      # 📎 **إصلاح 2026-07-28 (خطة `plans/009`):** كان النمط `screener_report_*.csv`
      #    و**لا شيء في المستودع كلّه ينتجه** (المطابقة الوحيدة كانت هذا السطر نفسه).
      #    البادئات الفعلية من `write_csv`/`_write_csv_file`: daily_watch · weekly_list ·
      #    trades · signals · missed. فكانت الخطوة تنجح **فارغة دائمًا** وتقارير التشغيلة
      #    تضيع مع الرنر (و`*.csv` في .gitignore فلا بديل).
      #    ⚠️ `if-no-files-found: ignore` يبقى: المسار اليومي لا يُنتج weekly_list والعكس،
      #    فالغياب الجزئي طبيعي. و`run_id` في الاسم يمنع تعارض الأسماء بين التشغيلات
      #    (نفس نمط ignition.yml).
      #    🧭 قاعدة: أي بادئة CSV جديدة تُضاف للكود يجب أن تُضاف هنا وإلا ضاع الملفّ بصمت.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-report-${{ github.run_id }}
          path: |
            daily_watch_*.csv
            weekly_list_*.csv
            trades_*.csv
            signals_*.csv
            missed_*.csv
          retention-days: 30
          if-no-files-found: ignore
