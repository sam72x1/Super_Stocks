name: "🌘🎯 حكم هدف الظل (T-SHADOW-TGT · قراءةٌ فقط)"

# 🌘🎯 العقد `fm_forensics/shadow_tgt/T_SHADOW_TGT_prereg.md` (#767 · أمرُ المالك 2026-11-06 · مدموجٌ قبل أيّ رقم):
#    status ⟵ أعدادٌ فقط بلا عائد · run ⟵ دقائقُ Polygon ⟵ الذراعان ⟵ قبل الأوان خروج 7 بلا عائد · وإلّا الحكم · و9 إن تغيّرت بصمةُ العقد.
#    🔒 يدويٌّ بلا كرون وبلا سرِّ تلغرام و`contents: read` · لا يكتب في المستودع (`TGV5`).
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status (أعداد) أو run (الحكم)"
        required: true
        default: status
        type: choice
        options: [status, run]

concurrency:
  group: super-stocks-shadow-tgt
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: 🌘🎯 T-SHADOW-TGT
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python fm_forensics/shadow_tgt/shadow_tgt.py --mode "${{ inputs.mode }}"
