name: "🔎 T-BASKET الصفقات الشاذّة (تشخيصٌ قارئ)"

# يقرأ شرائحَ تشغيلةِ `basket.yml` منتهيةً (artifacts) ويُسمّي الصفقاتِ الخارجة عن [−95%، ‏+100%] ومعها تقسيماتُ نافذتها ·
# بلا شبكةٍ خارجيّة · بلا أسرار · بلا تلغرام · لا يكتب في المستودع · لا حكمَ جديد.
permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "رقمُ تشغيلة basket.yml"
        required: true
        default: "43955351411"

jobs:
  outliers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
      - name: 📥 prep
        uses: actions/download-artifact@v4
        with:
          name: basket-prep
          path: fm_forensics/basket/out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: 📥 الشرائح
        uses: actions/download-artifact@v4
        with:
          pattern: basket-shard-*
          path: fm_forensics/basket/out
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: 🔎 الشاذّ
        run: python fm_forensics/basket/outliers.py
