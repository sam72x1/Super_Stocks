# ② بوابة CI (خطة إصلاح التدقيق 2026-07-12): تشغيل سويّة الاختبارات كاملة على كل
# دفع/PR — كانت السويّة (600+ فحص، تخرج بكود 1 عند أي فشل) لا يشغّلها أي شيء آليًّا
# (433 كوميت لـmain في 8 أسابيع بلا حارس). البوابة = «خروج 0»، لا عدد مقتبس.
name: Tests
permissions:
  contents: read
concurrency:
  # ⏰ اسمُ الحدث جزءٌ من المجموعة (2026-10-27): المجدولةُ لا تُلغي تشغيلةَ دمجٍ على main ولا تُلغيها ·
  #    والدفعُ وPR كما كانا (مرجعاهما مختلفان أصلًا: refs/heads/… مقابل refs/pull/…/merge).
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  pull_request:
  # ⏰ **يوميًّا على main** (أمرُ المالك 2026-10-27 «جدول السويّة على main»): دفعاتُ البوت بـ`GITHUB_TOKEN`
  #    لا تُطلق هذا الـworkflow ⇒ بقي main أحمرَ صامتًا 12 يومًا (2026-10-15 ⟶ 10-27 · #631) بأقفالٍ
  #    تسقط بالساعة والبيانات لا بالكود ⇒ السويّةُ نفسُها على آخر main كلَّ يوم · واليدويُّ للتحقّق.
  #    **بلا تلغرام وبلا سرّ** (الفشلُ أحمرُ في Actions · `TSC1`).
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # نفس نسخة الإنتاج (daily_screener.yml)
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # السويّة تعمل بلا إنترنت بتصميمها (كل الجالبات محقونة/مقلَّدة) — أي فشل هنا
      # فشل حقيقي في المنطق، لا عطل شبكة.
      - name: Run full test suite
        run: python3 test_bot.py
