# 🧪 مِجَسٌّ مؤقّت (يُحذف بعد قراءته) — عقدُ `tv_presession_prereg.md` (T-TVPRE): مفتاحُ البري من TradingView مقابل Polygon.
# قراءةٌ فقط: لا تلغرام · لا كتابةَ حالة · لا Polygon.
name: TV probe 3 (temporary)

on:
  workflow_dispatch:
    inputs:
      part:
        description: "PRE (T-TVPRE) · VOL (تسويةُ الحجم · قبولٌ مكتوبٌ قبل الرقم) · C2 (تشخيصُ طزاجة T-TVBARS · وصفيّ)"
        required: false
        default: "PRE"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
          TVPROBE3_PART: ${{ github.event.inputs.part }}
        run: python tv_probe3.py
