name: "🧪 مُعرِّف الشارت — التقييم (المصنوعة للضبط · الحقيقيّة للقبول) (chart_finder_prereg)"

# 🔒 قراءة/قياس فقط — لا كرون · لا تلغرام · لا كتابةَ حالة · الصورُ المصنوعة في الذاكرة ولا تُدفع.
#    العقد chart_finder_prereg.md §③-§⑤ · السرّان: POLYGON_API_KEY ومفتاحا الملفّات المجمَّعة.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "synth = المصنوعة (ضبط) · synth_split = نوافذُ §⑧-6 الموجَّهة (ملحق §⑫ · v1.1 مقابل v1.2) · real = الحقيقيّة الأولى (محترقة) · real2 = مجموعة ملحق §⑩ (v1.1 — بعد تجميد بطاقاتها)"
        required: true
        default: "synth"
      n:
        description: "عددُ نوافذ المصنوعة (العقد: 150)"
        required: false
        default: "150"
      g3:
        description: "1 = v1.2 (الافتراض) · 0 = G3 مطفأ لهذه التشغيلة ضبطًا مزدوجًا (ملحق §⑫-ب · لا يُحتسب حكمًا)"
        required: false
        default: "1"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🧪 التقييم
        env:
          PYTHONUNBUFFERED: "1"
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.POLYGON_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.POLYGON_S3_SECRET }}
          CHART_EVAL: ${{ inputs.mode }}
          CHART_EVAL_N: ${{ inputs.n }}
          CHART_EVAL_G3: ${{ inputs.g3 }}
        run: python chart_eval.py
