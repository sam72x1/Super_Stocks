name: app parity probe (مؤقّت — يُحذف قبل الدمج)

# 🔬📱 مطابقةُ تطبيق «مراقب استراتيجية فيصل» من الشموع — قراءةٌ فقط: بلا تلغرام ولا كتابة حالة ولا git.
# المعيارُ مكتوبٌ قبل الرقم في faisal_batches/2026-10-01/APP_PARITY_PREREG.md ورأسِ app_parity_probe.py.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
        run: python app_parity_probe.py
