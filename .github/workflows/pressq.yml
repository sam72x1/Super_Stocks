name: T-PRESS-Q (الضغطُ على مرشّحينا)

# 🗜️🎯 العقد `press_prereg.md §⑨` (مدفوعٌ قبل أيّ رقم · حرّاس PQV1-3).
# 🔒 بحث/قياس فقط · يدويّ بلا كرون · والأداةُ خارج مسار الفرز (قفل عزل).
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      year:
        description: "السنة (2024 · 2025 · 2026) — الحكم يلزمه الثلاث"
        required: true
        default: ""
      frozen_run_id:
        description: "لقطة PIT: 2024=31199493957 · 2025=31191327731 · 2026=31199510868"
        required: true
        default: ""
jobs:
  pressq:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download frozen dataset
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          run-id: ${{ github.event.inputs.frozen_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run press-q scan
        env:
          # 🔴 مدخلٌ بلا `env` = مدخلٌ ميّت (بصمةُ `BT_CANDLE`) — مقفولٌ `PS5`.
          BACKTEST_YEAR: ${{ github.event.inputs.year }}
          BT_FROZEN_PATH: frozen_backtest.pkl.gz
        run: python pressq_scan.py
