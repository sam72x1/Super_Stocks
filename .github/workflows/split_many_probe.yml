name: "🔁 مِجَسّ مقسّم أكثر من 3 مرّات (مؤقّت — R-02 · يُحذف بعد القراءة)"

# 🔒 قراءةٌ فقط — لا كرون · لا كتابة حالة · لا تلغرام · لا Polygon · لا أسرار.
# ⏳ مؤقّت: يُحذف مع `split_many_probe.py` بعد كتابة مُخرَجه في الحزمة (دفعة 2026-09-23 · §14 البند 3)
#    — ويعمل على فرع التطوير وحده (لا يصل `main`).
permissions:
  contents: read

on:
  push:
    branches: [claude/conversation-compaction-failure-088pki]
    paths:
      - split_many_probe.py
      - .github/workflows/split_many_probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🔁 المِجَسّ
        run: python split_many_probe.py
