name: SEC probe (temporary)
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "رموز مفصولة بفاصلة (فارغ = رموز القائمة الحالية + AAPL)"
        required: false
        default: ""
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe SEC (Form 4 URL shape + founding offering)
        env:
          PROBE_SYMS: ${{ github.event.inputs.symbols }}
        run: python sec_probe.py
