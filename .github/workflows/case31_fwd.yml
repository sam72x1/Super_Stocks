name: "🗂️🔬 T-CASE31 — الدفترُ الأماميّ الصامت (بلا تلغرام)"

# أمرُ المالك 2026-11-20 (`T-CASE31` ⑤ «للأمام»): كلَّ جلسةٍ يُسجَّل كلُّ صفٍّ في «تحت المتابعة» بقناع ما ثُبِّت (`data/case31_freeze.json`)
# في `fm_forensics/case31/data/case31_fwd.jsonl` الإلحاقيّ · ويُحسم بعد 20 جلسة · والبلاغُ للمالك بعد 4 أسابيع من أوّل تسجيل.
# 🔒 لا تلغرام · لا Polygon · لا حالةَ إنتاج · لا يمسّ أداةً ولا عتبة · وبلا ملفّ تثبيتٍ ببصمته يخرج 9 ولا يكتب شيئًا.
# ↩️ الإيقاف: وضعُ «# » أمام سطر `schedule` وسطر `cron`.
permissions:
  contents: write

on:
  schedule:
    - cron: "37 13 * * 2-6"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (record ثمّ settle ثمّ report) | record | settle | report"
        required: false
        default: "auto"

concurrency:
  group: super-stocks-case31-fwd
  cancel-in-progress: false

jobs:
  fwd:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # لقطاتُ git اليوميّة لـ«تحت المتابعة»

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🗂️ الدفترُ الأماميّ
        env:
          CASE31_FWD_MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode }}
          PYTHONUNBUFFERED: "1"
        run: python fm_forensics/case31/case31_fwd.py "$CASE31_FWD_MODE"

      - name: 💾 دفعُ الدفتر (fetch+rebase)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 🔧 2026-11-21 (CSF3): كلُّ ملفٍّ بندائه — `git add` بمسارٍ غائبٍ يفشل كلُّه، فكان غيابُ دفتر الحسم (أوّل 20 جلسة) سيمنع دفعَ دفتر التسجيل نفسِه
          for f in fm_forensics/case31/data/case31_fwd.jsonl fm_forensics/case31/data/case31_fwd_settled.jsonl fm_forensics/case31/out/FWD.md; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then echo "لا جديد — لا دفع"; exit 0; fi
          git commit -q -m "🗂️ T-CASE31 الدفترُ الأماميّ"
          for i in 1 2 3 4; do
            git fetch origin main && git rebase origin/main && \
              git push origin HEAD:main && exit 0
            echo "⚠️ محاولةُ الدفع $i فشلت — تراجعٌ أُسّيّ"
            sleep $((2 ** i))
          done
          echo "⛔ سقط الدفعُ بعد أربع محاولات — يُعلَن ولا يُصمت"
          exit 1
