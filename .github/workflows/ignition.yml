name: Ignition Radar (رادار الانطلاق اللحظي)

# 🔥 عامل جلسة حي: من الافتتاح، يلفّ كل ~45ث يفحص القائمة المؤهّلة ويكشف لحظة
# الاشتعال (حجم + كسر صاعد + تدفق أوامر يؤكّد) → تنبيه فوري «ادخل الآن». إشعار فقط.
#
# 🔬 (ب+ · قرار Codex §2a): الجلسة (6.5س) لا تُغطّى بجوب واحد (سقف رنر 6س). **3 jobs
# متسلسلة:** open_segment [الافتتاح→+195د] → close_segment [→الإغلاق] (يستعيد أختام الدِدوب
# من open فلا تنبيه مكرّر) → assemble_e2_session (يدمج + backfill بعد الإغلاق + المدقّق).
# التفاصيل: E2_IGNITION_SEGMENTED_ARCH.md. فاشل-آمن: بلا مفتاح = لا عمل.

# contents: write ليدفع الـassembler سجلّ القياس (summary/index) بالريبو عند النهاية
permissions:
  contents: write

on:
  schedule:
    # 🔬 P0-2 + 🔴 **إصلاح 2026-07-28**: الكرون كان 13:18 (قبل افتتاح الصيف 13:30 بـ12د)،
    # لكن **قياس 11 يومًا** أثبت أن GitHub يبدأ الجوب متأخّرًا **95-152 دقيقة (وسيط ~119)**
    # ⇒ الرادار كان يبدأ 15:05-15:50 UTC فيفوّت **أول ساعتين من كل جلسة** — بما فيها
    # الافتتاح نفسه، وهو أنشط نافذة وسببُ وجود الرادار («جوب واحد **من الافتتاح**»).
    # وهو أيضًا سبب `start_coverage_late` الذي أسقط كل جلسات قياس E2 (`session_complete=0`).
    # 11:11 UTC = الافتتاح − 139 دقيقة ⇒ بالوسيط يبدأ ~13:10 (وينتظر الجرس)، وبأسوأ تأخّر
    # مرصود ~13:43. الانتظار قبل الجرس لا يُنبّه أبدًا فالتقديم فاشل-آمن.
    # ⚠️ غيّرتُ معه: سقف الانتظار 90→150د (الشتاء) · MAX_RUNTIME 290→330 · timeout 300→345.
    - cron: "11 11 * * 1-5"
  workflow_dispatch: {}

# مجموعة تزامن مستقلة (لا يحفظ حالة الفرز → يعمل بالتوازي مع الفرز/المراقبة بلا تضارب)
concurrency:
  group: super-stocks-ignition
  cancel-in-progress: false

env:
  # سقف أمان لزمن كل مقطع (نادرًا يبلغ — الموعد الطبيعي = نهاية المقطع من الافتتاح).
  IGNITION_MAX_RUNTIME_MIN: "330"
  IGNITION_SEGMENT_SPLIT_MIN: "195"

jobs:
  # ═══ job1: مقطع الافتتاح [open, open+195د] ═══
  open_segment:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run open segment
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          E2_MEASUREMENT: "1"
          IGNITION_SEGMENT: "open"
          IGNITION_HANDOFF_OUT: "handoff_open.json"
        run: python ignition_live.py
      - name: Capture E2 environment (provenance)
        if: always()
        run: |
          mkdir -p e2_measurement
          { python -VV; echo "---pip freeze---"; pip freeze; } \
            > "e2_measurement/env_open_${{ github.run_id }}.txt" 2>&1 || true
      - name: Upload open segment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ign-open-${{ github.run_id }}
          path: |
            e2_measurement/
            handoff_open.json
          retention-days: 90
          if-no-files-found: warn

  # ═══ job2: مقطع الإغلاق [open+195د, close] — يستعيد دِدوب open (لا تنبيه مكرّر) ═══
  close_segment:
    runs-on: ubuntu-latest
    # 🔬 مراجعة Codex 5 (P0): `needs` للترتيب فقط (close يبدأ بعد انتهاء open) — **لا للنجاح**.
    # `if: always()` ⇒ فشل/إلغاء/انتهاء مهلة open **لا يلغي تنبيهات مقطع الإغلاق** (195د حتى
    # الإغلاق). فشل نقل القياس يجعل الجلسة غير مؤهّلة للتحليل، لا يُسكت الرادار.
    needs: open_segment
    if: always()
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # 🔬 مراجعة Codex 5 (P0): تنزيل الartifact **أفضل-جهد** — غيابه/فساده لا يمنع المسح
      # (ignition_live فاشل-آمن: بلا handoff = بلا استعادة دِدوب، والمدقّق يرفض الجلسة).
      - name: Download open segment (handoff + raw)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ign-open-${{ github.run_id }}
      - name: Run close segment
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          E2_MEASUREMENT: "1"
          IGNITION_SEGMENT: "close"
          IGNITION_HANDOFF_IN: "handoff_open.json"     # يستعيد أختام الدِدوب
          IGNITION_HANDOFF_OUT: "handoff_close.json"
        run: python ignition_live.py
      - name: Capture E2 environment (provenance)
        if: always()
        run: |
          mkdir -p e2_measurement
          { python -VV; echo "---pip freeze---"; pip freeze; } \
            > "e2_measurement/env_close_${{ github.run_id }}.txt" 2>&1 || true
      - name: Upload both segments (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ign-close-${{ github.run_id }}
          path: |
            e2_measurement/
            handoff_open.json
            handoff_close.json
          retention-days: 90
          if-no-files-found: warn

  # ═══ job3: الدمج بعد الإغلاق — يجمع المقطعين + backfill نهائي + المدقّق ═══
  assemble_e2_session:
    runs-on: ubuntu-latest
    # 🔬 مراجعة Codex 5: يجمع ما توفّر حتى لو تعثّر مقطع (المدقّق يحكم بالاكتمال، لا الـCI).
    needs: close_segment
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download both segments
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ign-close-${{ github.run_id }}
      - name: Assemble session (merge + post-close backfill)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}   # لـbackfill بعد الإغلاق
        run: python ignition_e2_assemble.py
      # 🔬 P1-7: دفع واحد فقط من الـassembler (summary/index + السجلّ القديم) — بلا || true على
      # الدفع (لا نخفي فشله). المقاطع لا تدفع شيئًا.
      # 🔴 **إصلاح 2026-07-28 (عطل حقيقي دام 13 يومًا):** كان الدفع **عاريًا بلا rebase**،
      # والجلسة تمتدّ ~4.5 ساعة فيتحرّك `main` أثناءها ⇒ `! [rejected] (fetch first)` ⇒
      # **كل ملخّص جلسة يضيع ومعه `ignition_log.json`** (جلسة واحدة فقط نجحت من 10).
      # وهو سبب «0/20 جلسة» الحقيقي — لا البوّابة الصارمة كما كان موثّقًا خطأً.
      # النمط أدناه = نفس المُثبَت في `telegram_collect.yml`: fetch+rebase وإعادة محاولة
      # بتراجع أُسّي، و`exit 1` صريح عند الفشل النهائي (لا نُعلن نجاحًا كذبًا).
      - name: Push E2 summary/index + legacy log (single push)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ignition_e2_summary.json ignition_e2_session_index.json \
                  ignition_log.json ignition_universe.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "لا تغييرات للدفع."; exit 0
          fi
          git commit -q -m "🔬 E2: ملخّص + سجلّ جلسة الرادار المدموجة (assembler)"
          ok=0
          for i in 1 2 3 4 5; do
            if git push; then ok=1; break; fi
            # الرفض غالبًا لأن الفرع تحرّك أثناء الجلسة ⇒ أعِد الأساس ثم أعِد المحاولة
            git fetch origin "$GITHUB_REF_NAME" \
              && git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
            sleep $((2**i))
          done
          if [ "$ok" != 1 ]; then
            echo "::error::⛔ فشل دفع ملخّص جلسة E2 بعد 5 محاولات — البيانات محفوظة في artifact"
            exit 1
          fi
      # 🔬 P0-6: بوّابة صارمة — تفشل الـjob لو الجلسة المدموجة غير مكتملة (بعد رفع artifact).
      # ⚠️ `if: always()` (إصلاح 2026-07-28): بدونها كانت البوّابة **تُتخطّى** كلّما فشل الدفع،
      # فيظهر الـjob أحمر ويُقرأ خطأً «البوّابة الصارمة» بينما هي لم تُشغَّل أصلًا — وهذا
      # بعينه ما أخفى العطل 13 يومًا. الآن يُبلَّغ السببان مستقلَّين.
      - name: Analyzer strict gate
        if: always()
        run: python ignition_e2_analyze.py e2_measurement --strict
      - name: Upload assembled session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ign-assembled-${{ github.run_id }}
          path: |
            e2_measurement/
            ignition_e2_summary.json
            ignition_e2_session_index.json
          retention-days: 90
          if-no-files-found: warn
