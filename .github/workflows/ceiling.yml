name: T-CEILING (سقف الانهيار M2)

# 🧱⛰️ يقيس: كم يُكلّف رفعُ `MAX_DROP_PCT` — الجدارُ الذي يحجب `RUBI` سبعةَ أيامٍ
#    متتالية ويصطاد عائلةَ فيصل (‏`rubi_case.md`)؟ العقد: `ceiling_prereg.md`
#    (مدفوعٌ قبل أيّ رقم · حرّاسُ V1-V5 · وسقفُ النجاح منحنى كلفةٍ لا تغييرٌ).
# 🔒 بحث/قياس فقط · بلا كرون · والأداةُ تضبط `CONFIG` **بعد الاستيراد** في عمليةِ
#    الذراع وحدها ⇒ الفارزُ الحيُّ لا يمرّ من هنا (‏صفر مسٍّ بالإنتاج).
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      year:
        description: "السنة (2024 · 2025 · 2026) — الحكم يلزمه الثلاث"
        required: true
        default: ""
      frozen_run_id:
        description: "لقطة PIT: 2024=31199493957 · 2025=31191327731 · 2026=31199510868"
        required: true
        default: ""
      probe_syms:
        description: "رموزُ المِجَسّ التشخيصيّ (خارج الحكم) — فارغ = RUBI"
        required: false
        default: ""
jobs:
  ceiling:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # 🧊 خطة 025
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download frozen dataset
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          run-id: ${{ github.event.inputs.frozen_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run ceiling arms
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKTEST_YEAR: ${{ github.event.inputs.year }}
          BT_FROZEN_PATH: frozen_backtest.pkl.gz
          # 🔴 مدخلٌ بلا `env` = مدخلٌ ميّت (بصمةُ `BT_CANDLE`) — مقفولٌ `CEI7`.
          CEIL_PROBE_SYMS: ${{ github.event.inputs.probe_syms }}
        run: python ceiling_arms.py
