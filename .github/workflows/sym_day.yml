name: "🔬 مجس سهم في جلسة (مسار الدقيقة كاملا)"

# 🔒 تشخيص/قراءة فقط — لا كرون · لا كتابة حالة · لا تلغرام · سقف نجاحه صفر
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      syms:
        description: "الرموز بفواصل (مثال: HUIZ,JZ)"
        required: true
        type: string
      days:
        description: "الأيام بفواصل (YYYY-MM-DD)"
        required: true
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🔬 التشخيص
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.POLYGON_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.POLYGON_S3_SECRET }}
          PROBE_SYMS: ${{ inputs.syms }}
          PROBE_DAYS: ${{ inputs.days }}
        run: python sym_day_probe.py
