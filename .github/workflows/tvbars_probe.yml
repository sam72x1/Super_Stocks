name: tvbars probe (مؤقّت — يُحذف قبل الدمج)

# 🧪 التحقّقُ الطرفيّ من BARS_SOURCE=tradingview على كون الفرز — قراءةٌ فقط: بلا تلغرام ولا كتابة حالة ولا Polygon.
on:
  pull_request:
    paths:
      - "tvbars_probe.py"
      - ".github/workflows/tvbars_probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        run: python tvbars_probe.py
