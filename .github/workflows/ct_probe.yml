name: "🧪 مِجَسّ ClinicalTrials.gov (مؤقّت — يُحذف بعد القراءة)"

# 🔒 قراءةٌ فقط — لا كرون · لا تلغرام · لا كتابةَ حالة · لا مفتاح.
# السؤال: سطرُ «📅 اكتمال تجربة سريرية» صفرٌ من 11 سهمَ رعايةٍ صحّيّة ⇒ هل القناةُ ميّتةٌ
# أم الحدثُ نادر؟ `clinical_events` فاشلةٌ-آمنة فالصمتُ لا يفرّق، والموقعُ محجوبٌ عن بيئة
# التطوير (‏403 على نفق CONNECT) ⇒ يُسأل رنرُ GitHub. يُحذف هو و`ct_probe.py` بعد القراءة.
permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1 — نسخةُ الإنتاج
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: 🧪 المِجَسّ
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 ct_probe.py
