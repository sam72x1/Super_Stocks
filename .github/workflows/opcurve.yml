name: "🕵️📈 T-OPCURVE — منحنى ما بعد مِرساة «هنا الدخول» (opcurve_prereg)"

# 🔒 قراءة/قياس فقط — لا كرون · لا كتابة حالة · لا تلغرام · العقد opcurve_prereg.md (§⑨)
#    وصفيٌّ بنصّ العقد: يُنشَر جدولٌ ولا يُحكَم · سرُّ POLYGON_API_KEY وحدَه.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      since:
        description: "أوّلُ يومٍ يُقاس (YYYY-MM-DD) — العقد §②"
        required: false
        default: "2026-08-18"
      h2_from:
        description: "أوّلُ يومِ النصف الثاني H2 (YYYY-MM-DD) — العقد §④"
        required: false
        default: "2026-09-01"

jobs:
  opcurve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (كامل التاريخ لقراءة لقطات op_entry_state)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🕵️📈 القياس الوصفيّ
        env:
          PYTHONUNBUFFERED: "1"
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          OPCURVE_SINCE: ${{ inputs.since }}
          OPCURVE_H2_FROM: ${{ inputs.h2_from }}
        run: python opcurve_probe.py
