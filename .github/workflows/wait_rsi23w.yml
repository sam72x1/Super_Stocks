name: ⏳ T-WAIT-23W — تأكيدُ RSI 23 والأسبوعيّ بضبطٍ مطابَقِ التعبئة
# العقد: wait_rsi23w_prereg.md (مدفوع قبل أيّ سطر من الأداة).
# بحث/قياس فقط · يدويّ بلا كرون · صفر مسّ إنتاج (Super_stock.py و wait_rsi27_arms.py لا يُمَسّان).
# 🔒 سنتان في تشغيلةٍ واحدة ⇒ الحكمُ المجمَّع يصدر من مصدرٍ واحدٍ قابلٍ لإعادة الإنتاج.
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      year_a:
        description: "السنة الأولى (مثال 2022)"
        required: true
        default: ""
      run_a:
        description: "run id للقطة السنة الأولى (2022=34331756534 · 2021=34331758846 · 2023=31574165523 · 2024=31199493957 · 2025=31191327731 · 2026=34322427155)"
        required: true
        default: ""
      year_b:
        description: "السنة الثانية (اختياريّة — الحكمُ المجمَّع يلزمه سنتان)"
        required: false
        default: ""
      run_b:
        description: "run id للقطة السنة الثانية"
        required: false
        default: ""
      holdout_after:
        description: "الحصادُ الأماميّ: تُقاس الإشاراتُ بعد هذا التاريخ حصرًا (YYYY-MM-DD) — فارغ = السنةُ كاملة"
        required: false
        default: ""
jobs:
  wait-23w-arms:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download snapshot A
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          run-id: ${{ github.event.inputs.run_a }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pit_a
      - name: Download snapshot B
        if: ${{ github.event.inputs.run_b != '' }}
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          run-id: ${{ github.event.inputs.run_b }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pit_b
      - name: Compose populations
        id: compose
        env:
          YA: ${{ github.event.inputs.year_a }}
          YB: ${{ github.event.inputs.year_b }}
          RB: ${{ github.event.inputs.run_b }}
        run: |
          Y="$YA"; P="pit_a/frozen_backtest.pkl.gz"
          if [ -n "$RB" ]; then Y="$Y,$YB"; P="$P,pit_b/frozen_backtest.pkl.gz"; fi
          echo "years=$Y" >> "$GITHUB_OUTPUT"
          echo "paths=$P" >> "$GITHUB_OUTPUT"
          echo "📦 السنوات: $Y · اللقطات: $P"
      - name: Run wait-23W arms
        env:
          BT_YEARS: ${{ steps.compose.outputs.years }}
          BT_FROZEN_PATHS: ${{ steps.compose.outputs.paths }}
          HOLDOUT_AFTER: ${{ github.event.inputs.holdout_after }}
        run: python wait_rsi23w_arms.py
      - name: Upload rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wait-23w-rows-${{ github.event.inputs.year_a }}-${{ github.event.inputs.year_b }}
          path: wait_rsi23w_rows.jsonl
          retention-days: 90
