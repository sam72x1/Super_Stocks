name: dfi probe (مؤقّت — يُحذف قبل الدمج)

# 🧪 سلامةُ البيانات: الطزاجة والإجراءات المؤسسيّة والكون — قراءةٌ فقط: بلا تلغرام ولا كتابة حالة ولا Polygon ولا git.
on:
  pull_request:
    paths:
      - "dfi_probe.py"
      - ".github/workflows/dfi_probe.yml"
  workflow_dispatch:
    inputs:
      focus:
        description: "رموزُ التتبّع بفاصلة"
        required: false
        default: "DLXY"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          DFI_FOCUS: ${{ github.event.inputs.focus || 'DLXY' }}
        run: python dfi_probe.py
