name: "🧺🎯 T-ENV-LIMIT — أمرُ بيعٍ جاهز على لمس صيّاد الغلاف (قراءةٌ فقط · مرّةً واحدة)"
# أمرُ المالك 2026-11-19 (استثناءٌ وصفيٌّ واحد قبل الإقفال) · العقد fm_forensics/envlimit/T_ENV_LIMIT_prereg.md مدموجٌ قبل أيّ رقم.
# يدويٌّ بلا كرون · لا تلغرام · لا دفع · النتيجةُ سجلٌّ و artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-stocks-envlimit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip
      - run: pip install -r requirements.txt
      - name: ⚖️ القياس
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python fm_forensics/envlimit/envlimit.py | tee envlimit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: envlimit-log
          path: envlimit.log
          retention-days: 90
