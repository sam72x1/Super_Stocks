name: PRICE-ANCHOR (📅💲 تأريخُ شارتات فيصل بمرساة السعر)

# 🔒 قراءةٌ فقط: لا كرون · لا حالة · لا سرّ. يكتب TSV منفصلًا لا يمسّ الفرز.
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip
      - run: pip install -r requirements.txt
      - name: 📅💲 أرّخ بمرساة السعر (قراءةٌ فقط)
        run: python faisal_price_anchor.py
      - name: 📎 ارفع الجدولَ artifact (لا يُدفَع إلى المستودع)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-anchor-${{ github.run_id }}
          path: faisal_price_anchor_dates.tsv
          if-no-files-found: warn
          retention-days: 90
