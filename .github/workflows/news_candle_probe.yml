name: "📰 مِجَسّ شمعة الخبر (مؤقّت — R-01 · يُحذف بعد القراءة)"

# 🔒 قراءةٌ فقط — لا كرون · لا كتابة حالة · لا تلغرام · لا Polygon.
# 🔑 السرُّ الوحيد `SEC_CONTACT` = هويّةُ الوكيل لدى SEC (بدونه ترتدّ `SEC_UA` لبريدٍ وهميّ فتحجب SEC).
# ⏳ مؤقّت: يُحذف مع `news_candle_probe.py` بعد كتابة مُخرَجه في `FAISAL_SOURCE_LEDGER.md`
#    (دفعة 2026-09-23 · `U-04`) — ويعمل على فرع التطوير وحده (لا يصل `main`).
permissions:
  contents: read

on:
  push:
    branches: [claude/conversation-compaction-failure-088pki]
    paths:
      - news_candle_probe.py
      - .github/workflows/news_candle_probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 📰 المِجَسّ
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python news_candle_probe.py
