name: 🥇🎯 T-GOLD-ENTRY — أذرع آلة دخول فيصل على اللقطات

# العقد: gold_entry_prereg.md (مدفوع قبل الأداة) + ملحق ① (قبل أي تشغيلة).
# بحث/قياس فقط · يدوي بلا كرون · صفر مسّ إنتاج · سقف النجاح اقتراح للمالك.
# 🔴 لا مدخل «arm»: المِشية واحدة والأذرع السبع تُقاس معًا (ميزانية ثابتة
#    بالبناء) — ومدخلٌ بلا env مدخلٌ ميت (قاعدة P1).
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      year:
        description: "السنة (2023 · 2024 · 2025) — الحكم يلزمه الثلاث"
        required: true
        default: ""
      frozen_run_id:
        description: "لقطة PIT: 2023=31574165523 · 2024=31199493957 · 2025=31191327731"
        required: true
        default: ""
jobs:
  gold_entry:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download frozen dataset
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          run-id: ${{ github.event.inputs.frozen_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run gold entry arms
        env:
          BACKTEST_YEAR: ${{ github.event.inputs.year }}
          BT_FROZEN_PATH: frozen_backtest.pkl.gz
        run: python gold_entry_arms.py
