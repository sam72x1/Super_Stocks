# 🧪 مِجَسٌّ مؤقّت (يُحذف في الـPR نفسِه) — حقولُ TradingView لقائمة البري وعيّنةُ مطابقةٍ مع ياهو.
# قراءةٌ فقط: لا تلغرام · لا كتابةَ حالة · لا Polygon.
name: TV probe 2 (temporary)

on:
  workflow_dispatch:
    inputs:
      parts:
        description: "الأجزاء (A B C D)"
        required: false
        default: "ABC"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
          PARTS: ${{ github.event.inputs.parts }}
        run: python tv_probe2.py
