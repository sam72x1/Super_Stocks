name: T-HUNTER-SIX (split-hunter walk on Faisal's six)
# 🪝 قياس **صيّاد المقسّم** نفسه على الستة + الشاهدين (JEM/NUWE) — العقد
# `OPUS_EXECUTION_PACKAGE.md` ④-د · التسجيل المسبق `hunter_six_prereg.md`.
# بحث/تشخيص فقط: بلا تلغرام · بلا حفظ حالة · بلا Yahoo للأسعار (لقطة مجمّدة إلزامية).
# ⚠️ الجدول يُطبع **في اللوج** (سياسة الشبكة تمنع تنزيل الـartifacts) — الـCSV أرشيف.
permissions:
  contents: read
  actions: read          # لتحميل لقطة التجميد من تشغيلة freeze
on:
  workflow_dispatch:
    inputs:
      frozen_run_id:
        description: "run-id لتشغيلة «Freeze backtest dataset» (إلزامي — OHLCV+splits من اللقطة)"
        required: true
        default: ""
      symbols:
        description: "رموز مفصولة بفاصلة (فارغ = AZI,DSY,EHGO,ZCMD,JZ,SPRC,JEM,NUWE)"
        required: false
        default: ""
      window:
        description: "عدد الجلسات **قبل** لحظة فيصل (افتراضي 40)"
        required: false
        default: "40"
      post:
        description: "عدد الجلسات **بعد** لحظة فيصل (افتراضي 10)"
        required: false
        default: "10"
      moments:
        description: "تحديد/تصحيح لحظة فيصل: SYM=YYYY-MM-DD,… (لازم لـAZI/JEM — لحظتاهما غير موثّقتين)"
        required: false
        default: ""
      floats:
        description: "تجاوز يدويّ للفلوت: SYM=NUM,… (اختياري — يُطبع مصدره دائمًا)"
        required: false
        default: ""
      counter:
        description: "1 = ذراع تشخيصية: إعادة نداء المِجَسّ بنافذة عمرٍ موسَّعة (تفصل «سقط على عمر التقسيم وحده»)"
        required: false
        default: "0"
      cliff_arm:
        description: "⛰️ ذراع T-CLIFF (cliff_prereg.md): c0 الأساس · c1=25% · c2=20% · c3=تراكميّ≥40%/≤20ج · c4=بلا مُرشّح"
        required: false
        default: "c0"
jobs:
  hunter-six:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # 🧊 خطة 025
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download frozen dataset
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          run-id: ${{ github.event.inputs.frozen_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run T-HUNTER-SIX walk
        env:
          SCREENER_MODE: BACKTEST
          BT_FROZEN_PATH: frozen_backtest.pkl.gz
          HUNTER_SIX_SYMBOLS: ${{ github.event.inputs.symbols }}
          HUNTER_SIX_PRE: ${{ github.event.inputs.window }}
          HUNTER_SIX_POST: ${{ github.event.inputs.post }}
          HUNTER_SIX_MOMENTS: ${{ github.event.inputs.moments }}
          HUNTER_SIX_FLOAT: ${{ github.event.inputs.floats }}
          HUNTER_SIX_COUNTER: ${{ github.event.inputs.counter }}
          HUNTER_SIX_CLIFF: ${{ github.event.inputs.cliff_arm }}
          HUNTER_SIX_CSV: hunter_six_walk.csv
        run: python hunter_six_check.py
      - name: Upload walk CSV (أرشيف — الحكم من اللوج)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunter-six-walk
          path: hunter_six_walk.csv
          if-no-files-found: warn
          retention-days: 90
