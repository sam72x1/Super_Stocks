name: "👁️ T-FAISAL-EYE — عين فيصل · جلبُ الشموع (قياسٌ فقط · بلا تلغرام)"

# أمرُ المالك 2026-11-21 · العقد fm_forensics/faisal_eye/T_FAISAL_EYE_prereg.md (مدموجٌ قبل أيّ رقم) · قياسٌ فقط.
# يدويٌّ بلا كرون · لا تلغرام · لا Polygon · لا أسرار: شموعُ TradingView (يوميّ · 4س ممتدّ · أسبوعيّ) ومعاملاتُ ياهو ⟵ data/bars/
# 🖼️ الصورُ لا تُدفع: لا يرفع هذا الملفُّ أيَّ صورةٍ ولا مجلّد .scratch
permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: super-stocks-faisal-eye
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip
      - run: pip install -r requirements.txt
      - name: 📺 جلبُ الشموع
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python fm_forensics/faisal_eye/eye.py fetch | tee faisal_eye_fetch.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faisal-eye-fetch
          path: faisal_eye_fetch.log
          retention-days: 90
      - name: 💾 إيداعُ الشموع (بياناتٌ لا كود)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d fm_forensics/faisal_eye/data/bars ]; then git add -f fm_forensics/faisal_eye/data/bars; fi
          if git diff --cached --quiet; then echo "لا جديد"; exit 0; fi
          git commit -q -m "👁️ T-FAISAL-EYE بيانات: شموع TradingView"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin "$GITHUB_REF_NAME" && git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
            sleep 5
          done
          exit 1
