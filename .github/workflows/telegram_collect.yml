name: 📥 اسحب صور التلغرام إلى المستودع
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      max_files:
        description: "سقف عدد الصور لهذا التشغيل (افتراضي 600)"
        required: false
        default: ""
concurrency:                 # لا تشغيلان متزامنان يتنافسان على نفس الفرع
  group: telegram-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # 🧊 خطة 025
      - run: pip install -r requirements.txt
      - name: Pull images from the Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_MAX_FILES: ${{ github.event.inputs.max_files }}
        run: python telegram_collect.py
      - name: Update the coverage ledger
        run: python image_audit.py
      # 🛡️ نسخة ثانية **قبل** الدفع: لو أخفق الدفع لأي سبب لا تضيع الصور
      # (درس 2026-07-27: دفعٌ على نفس الفرع أثناء التشغيل رفض دفع 367 صورة فضاعت).
      - name: Safety copy as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faisal-images
          path: |
            faisal_images/
            telegram_collect_state.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit what arrived
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f لأن faisal_images/* مُستثنى بـ.gitignore حمايةً من الإضافة العابرة
          git add -f faisal_images/ FAISAL_IMAGE_AUDIT.md faisal_image_audit.json \
                     telegram_collect_state.json telegram_collect_report.md \
                     2>/dev/null || true
          if git diff --cached --quiet; then
            echo "لا جديد — لا commit"; exit 0
          fi
          n=$(git diff --cached --name-only -- faisal_images/ | wc -l)
          git commit -q -m "📥 صور التلغرام: $n ملفًا + تحديث سجلّ التغطية"
          ok=0
          for i in 1 2 3 4 5; do
            if git push; then ok=1; break; fi
            # الرفض غالبًا لأن الفرع تحرّك ⇒ أعِد الأساس ثم أعِد المحاولة
            git fetch origin "$GITHUB_REF_NAME" \
              && git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
            sleep $((2**i))
          done
          if [ "$ok" != 1 ]; then
            echo "::error::⛔ فشل دفع الصور بعد 5 محاولات — الصور محفوظة في artifact"
            exit 1        # ⚠️ فشل صريح: لا نُعلن نجاحًا كذبًا (درس 2026-07-27)
          fi
      - name: Summary
        if: always()
        run: |
          echo "### 📥 نتيجة السحب" >> $GITHUB_STEP_SUMMARY
          head -6 FAISAL_IMAGE_AUDIT.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
