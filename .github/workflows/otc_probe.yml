name: 🔬 مِجَسّ النقل من OTC (مؤقّت)
# يُحذف هو والسكربت بعد قراءة النتيجة (سابقة: مِجَسّ Form 4 وChartExchange).
permissions:
  contents: write        # ⚠️ نسيتها أول مرة ⇒ نجح المِجَسّ وفشل دفع نتيجته (403)
on:
  workflow_dispatch:
    inputs:
      sample:
        description: "حجم العيّنة (افتراضي 220)"
        required: false
        default: ""
      years:
        description: "نافذة «تسجيل حديث» بالسنوات (افتراضي 3)"
        required: false
        default: ""
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          OTC_SAMPLE: ${{ github.event.inputs.sample }}
          OTC_YEARS: ${{ github.event.inputs.years }}
        run: python otc_probe.py 2>&1 | tee otc_probe_result.md
      - name: Publish result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otc-probe
          path: otc_probe_result.md
          retention-days: 7
      - name: Summary
        if: always()
        run: cat otc_probe_result.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
      - name: Commit result so it can be read from the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f otc_probe_result.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "🔬 نتيجة مِجَسّ النقل من OTC"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin "$GITHUB_REF_NAME" \
              && git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
            sleep $((2**i))
          done
          echo "::error::تعذّر دفع النتيجة — موجودة في artifact"; exit 1
