name: HEADCUT (🎯✂️ بِع قبل رأس شمعة الهبوط — T-HEADCUT)

# 🔒 **قراءةٌ فقط**: لا كرون · لا كتابةَ حالة · **ولا سرَّ تلغرام** · ولا شحنَ
#    مهما كانت النتيجة. العقد: `headcut_prereg.md`.
# 🔒 **واللقطاتُ الثلاثُ عينُ لقطات `trail.yml`/`exitmgmt.yml`** — شرطُ `V-H1`:
#    `H0` يجب أن يُعيد `Y0` المنشورَ في `trail_result.md` بت-بت أو يخرج 5.
permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      snap_2023:
        description: "run-id للقطة 2023 (نفسُ لقطة trail.yml — شرطُ V-H1)"
        required: true
        default: "31574165523"
      snap_2024:
        description: "run-id للقطة 2024 (نفسُ لقطة trail.yml — شرطُ V-H1)"
        required: true
        default: "31199493957"
      snap_2025:
        description: "run-id للقطة 2025 (نفسُ لقطة trail.yml — شرطُ V-H1)"
        required: true
        default: "31191327731"
      dry:
        description: "🧪 وضعُ الجدوى — أعدادٌ بلا أيّ R (اكتب 1)"
        required: false
        default: ""
      tsv:
        description: "📄 اطبع جدولَ الصفوف — والحكمُ يبقى آخرَ سطر (اكتب 1)"
        required: false
        default: ""

jobs:
  headcut:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: تنزيل لقطة 2023
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          path: snap2023
          run-id: ${{ inputs.snap_2023 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: تنزيل لقطة 2024
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          path: snap2024
          run-id: ${{ inputs.snap_2024 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: تنزيل لقطة 2025
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          path: snap2025
          run-id: ${{ inputs.snap_2025 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 🎯✂️ قِس قصَّ الهدف (السنوات الثلاث · ميزانيةٌ واحدة)
        env:
          PYTHONUNBUFFERED: "1"
          HEADCUT_DRY: ${{ inputs.dry }}
          HEADCUT_TSV: ${{ inputs.tsv }}
          HEADCUT_SNAPSHOTS: >-
            2023:snap2023/frozen_backtest.pkl.gz,2024:snap2024/frozen_backtest.pkl.gz,2025:snap2025/frozen_backtest.pkl.gz
        run: python headcut_arms.py
