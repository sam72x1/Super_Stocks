# 🧪 مِجَسٌّ مؤقّت (يُحذف بعد قراءته) — حسمُ الحصاد على دقائق TradingView مقابل ياهو 5 دقائق (مصدرٌ مستقلّ) وفحصُ المقياس.
# قراءةٌ فقط: لا تلغرام · لا كتابةَ حالة · لا Polygon. معيارُ القبول مكتوبٌ في رأس tv_harvest_probe.py قبل أوّل تشغيل.
name: TV harvest probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
        run: python tv_harvest_probe.py
