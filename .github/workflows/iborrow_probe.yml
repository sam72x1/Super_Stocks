name: "🩺💧 مِجَسٌّ مؤقّت — تاريخُ المتاح في iBorrowDesk (يُحذف بعد القراءة)"

# 🔒 قراءةٌ فقط · بلا سرّ · بلا تلغرام · بلا كرون — يُطبع شكلُ الردّ ولا يُحسب رقمُ فرضيّة
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip
      - run: pip install -r requirements.txt
      - name: 🩺 الشكل
        env:
          PYTHONUNBUFFERED: "1"
        run: python iborrow_probe.py
