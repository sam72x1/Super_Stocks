name: E2 Recover (استرجاع جلسات الرادار الضائعة)
# 🔬♻️ ليليٌّ مجدول (`schedule` أدناه) ويدويٌّ عند الطلب. يُنزّل artifacts تشغيلات الرادار السابقة (`ign-assembled-<run_id>`)
# ويُعيد ملخّصاتها إلى الريبو — بعد أن اكتُشف (2026-07-28) أن دفع الassembler كان
# **عاريًا بلا rebase** فضاعت ملخّصات ~9 جلسات رغم نجاح القياس نفسه.
# استرجاع/دمج فقط: لا يمسّ الرادار ولا الفرز ولا أي جذر.
# 🔴 (2026-09-25): وصفُ هذا الرأس له بأنه يدويٌّ حصرًا كان بائتًا منذ 2026-07-28 — الكرونُ أُضيف بعد
#    ذلك السطر بـ33 دقيقة (`1cc9dd323`) ولم يُحدَّث الرأس · `WFH1` يقرأ الجدولةَ من YAML لا من هذا النصّ.
permissions:
  contents: write
  actions: read           # لتنزيل artifacts تشغيلات أخرى
on:
  # 🛡️ شبكة أمان يومية بعد الإغلاق (الفصلان): تُصالح الفهرس مع **آخر تشغيلات الرادار
  # المكتشَفة آليًّا** فلا يعتمد شيء على تذكّر أحد. الدفع صار محميًّا بـrebase فلا يُتوقَّع
  # ضياع جديد — وهذي تلتقط أي انقطاع مستقبليّ (شبكة/artifact متأخّر) بلا ضجيج: صامتة
  # تمامًا حين لا جديد (`لا جديد — كل الجلسات موجودة سلفًا`).
  schedule:
    - cron: "37 22 * * 1-5"        # بعد إغلاق الصيف (20:00) والشتاء (21:00) وبعد الassembler
  workflow_dispatch:
    inputs:
      run_ids:
        description: "أرقام تشغيلات الرادار مفصولة بفاصلة (فارغ = اكتشاف آخر 15 تشغيلة آليًّا)"
        required: false
        default: ""
concurrency:
  group: e2-recover
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # 🧊 خطة 025
      - name: Download assembled artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDS: ${{ github.event.inputs.run_ids }}
        run: |
          set -u
          LIST="${IDS//,/ }"
          # فارغ ⇒ **اكتشاف آليّ** لآخر تشغيلات الرادار (لا قائمة مثبَّتة تتقادم).
          if [ -z "${LIST// /}" ]; then
            LIST=$(gh run list --workflow ignition.yml --limit 15 \
                     --json databaseId -q '.[].databaseId' | tr '\n' ' ')
          fi
          if [ -z "${LIST// /}" ]; then
            echo "::error::⛔ تعذّر اكتشاف أي تشغيلة رادار"; exit 1
          fi
          mkdir -p recovered
          got=0; miss=""
          for id in $LIST; do
            # 🔴 (2026-09-25): محاولتان **ونصُّ الخطأ يُطبع** — جلسة 08-17 طُبع عنها «لا artifact (… انتهت
            #    مدّة الاحتفاظ)» و`expires_at` 2026-11-15 ⇒ التعذّرُ عابرٌ لا انتهاء (`36095794496`).
            ok=0; err=""
            for try in 1 2; do
              if err=$(gh run download "$id" -n "ign-assembled-$id" -D "recovered/$id" 2>&1); then
                ok=1; break
              fi
              rm -rf "recovered/$id"
              if [ "$try" = 1 ]; then sleep 3; fi
            done
            if [ "$ok" = 1 ]; then
              echo "✅ $id"; got=$((got+1))
            else
              echo "⚠️ $id — تعذّر التنزيل (محاولتان): ${err%%$'\n'*}"; miss="$miss $id"
            fi
          done
          echo "نُزِّل $got · مفقود:${miss:- لا شيء}"
          # صفر تنزيلات = لا فائدة، أبلغ صراحةً ولا تُعلن نجاحًا كذبًا
          if [ "$got" = 0 ]; then echo "::error::⛔ لم يُنزَّل أي artifact"; exit 1; fi
      # 🗄️ (2026-09-25) **أرشيفُ الخام المتجدّد** — artifacts الجلسات احتفاظُها 90 يومًا وبوّابتا E2-B/C
      #    تحتاجان خامَ أشهر (أوّلُ مكتملةٍ 07-29 ينتهي ≈10-27) ⇒ أحدثُ أرشيفٍ غيرِ منتهٍ يُنزَّل ويُتّحد مع
      #    جلسات الليلة ويُرفع من جديد (احتفاظٌ جديد). **لا يُدفَع للريبو** (مواصفة E2 §5/§12 · خامُ Polygon).
      #    والحالةُ تُكتب ولا تُسقط الجوب: تعذّرٌ ⇒ `failed` ⇒ لا يُرفع أصغرُ من السابق (`e2_recover.py`).
      - name: Download previous raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          META=$(gh api "repos/$REPO/actions/artifacts?name=e2-raw-archive&per_page=50" \
                   -q '[.artifacts[] | select(.expired == false)] | sort_by(.created_at)
                       | if length == 0 then "NONE" else (last | "\(.workflow_run.id) \(.created_at)") end' \
                 2>/dev/null) || META="ERR"
          if [ "$META" = "NONE" ]; then
            echo "none" > archive_prev_status; echo "🗄️ لا أرشيفَ سابق — تأسيس"
          elif [ "$META" = "ERR" ] || [ -z "$META" ]; then
            echo "failed" > archive_prev_status; echo "::warning::⚠️ تعذّر سؤالُ API عن الأرشيف السابق"
          elif gh run download "${META%% *}" -n e2-raw-archive -D archive_prev; then
            echo "ok ${META#* }" > archive_prev_status; echo "🗄️ الأرشيفُ السابق: $META"
          else
            echo "failed" > archive_prev_status; echo "::warning::⚠️ تعذّر تنزيلُ الأرشيف السابق ($META)"
          fi
      - name: Merge recovered sessions into repo index
        run: python e2_recover.py recovered | tee recover_report.txt
      - name: Rebuild raw archive (union · never shrinks)
        run: python e2_recover.py --archive archive_prev e2_measurement e2_raw_archive | tee -a recover_report.txt
      - name: Upload raw archive (renews the 90-day retention)
        if: hashFiles('archive_upload.flag') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2-raw-archive
          path: e2_raw_archive/
          retention-days: 90
          if-no-files-found: error
      - name: Strict validator over all recovered sessions (تقرير لا بوّابة)
        continue-on-error: true
        run: python ignition_e2_analyze.py e2_measurement --strict | tee -a recover_report.txt
      # ⚠️ **الفهرس وحده يُدفَع.** `e2_measurement/` مُستثنى بـ`.gitignore` **عمدًا**
      # (مواصفة E2 §5/§12: الخام يعيش في artifacts لا في الريبو) — والمجلّدات المسترجَعة
      # تبقى في مساحة العمل ليقرأها المدقّق أعلاه ثم تُرمى مع الرنر. لا تُضِفه هنا:
      # `git add` على مسار مُستثنى **يتخطّاه صامتًا** فيوهم أنه دُفِع.
      - name: Push recovered index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ignition_e2_session_index.json ignition_log.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "لا جديد — كل الجلسات موجودة سلفًا"; exit 0
          fi
          git commit -q -m "🔬♻️ E2: استرجاع ملخّصات الجلسات الضائعة من artifacts"
          ok=0
          for i in 1 2 3 4 5; do
            if git push; then ok=1; break; fi
            git fetch origin "$GITHUB_REF_NAME" \
              && git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
            sleep $((2**i))
          done
          if [ "$ok" != 1 ]; then
            echo "::error::⛔ فشل دفع الجلسات المسترجَعة بعد 5 محاولات"; exit 1
          fi
      - name: Summary
        if: always()
        run: |
          echo '### 🔬♻️ استرجاع جلسات E2' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat recover_report.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
