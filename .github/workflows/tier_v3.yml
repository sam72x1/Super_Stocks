name: "🥇③ تصنيف v3 (tier_v3_prereg)"

# 🔒 قراءة/إحصاء فقط — لا كرون · لا كتابة حالة · لا تلغرام · العقد tier_v3_prereg.md
# يُنزّل صفوف kasih2 من تشغيلاتها (المقياس الواحد) ثم يشغّل tier_v3_scan.py.
permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: "معرّفات تشغيلات kasih2 حاملة الصفوف (بفواصل — الثلاثة عشر في العقد §②)"
        required: true
        type: string

jobs:
  tier_v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 📥 تنزيل صفوف kasih2 من التشغيلات
        env:
          GH_TOKEN: ${{ github.token }}
          TV3_RUN_IDS: ${{ inputs.run_ids }}
        run: |
          set -e
          IFS=',' read -ra IDS <<< "$TV3_RUN_IDS"
          for id in "${IDS[@]}"; do
            id="$(echo "$id" | tr -d '[:space:]')"
            [ -z "$id" ] && continue
            gh run download "$id" --repo "$GITHUB_REPOSITORY" \
              --pattern 'kasih2-rows-*' --dir "/tmp/tv3-dl/$id" \
              || echo "⚠️ تعذّر تنزيل $id — يُعلَن ولا يُصمت"
          done
          find /tmp/tv3-dl -name 'kasih2_rows_*.jsonl' -exec cp -v {} . \; || true
          ls -la kasih2_rows_*.jsonl

      - name: 🥇③ الإحصاء والحكم
        run: python tier_v3_scan.py
