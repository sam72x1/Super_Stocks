name: Hand-flow harvester (AI-hand phase 1)
# 🤖🖐️ المرحلة 1: يجمع بيانات التدفق الحيّة عند كل مسح (بحث/جدوى — يبني بيانات الوكيل).
# فاشل-آمن: بلا POLYGON_API_KEY أو HAND_COLLECT!=1 = لا عمل. خارج الفرز/الإنتاج بالكامل.
permissions:
  contents: write          # git_save يحفظ hand_flow_log.jsonl ليتراكم عبر الجلسات
on:
  workflow_dispatch:
  schedule:
    # ⏰ تصحيح تغطية (2026-07-24، بعد فحص أول يوم جمع): كان `*/30 14-21` فيسقط بأمرين —
    #  (1) **الافتتاح غير مغطّى**: أول تشغيل فعلي كان 15:46 والنظرة للخلف 90د تصل 14:16 فقط،
    #      بينما افتتاح الصيف 13:30 = **أعلى نافذة احتمالًا للمسح** (المضارب يكنس السيولة عند
    #      الجرس) تضيع كل يوم. الآن يبدأ 13:13/13:43 فيغطّيه (وشتاءً حتى إغلاق 21:00).
    #  (2) **الدقيقة المستديرة تُسقَط**: 5 تشغيلات فقط من 16 فتحة يوم 2026-07-23 — نفس درس
    #      الكرون الموثّق (الدقيقة 0/30 مزدحمة عند GitHub؛ غير المستديرة تقلّل الإسقاط جوهريًّا).
    - cron: "13,43 13-21 * * 1-5"   # ساعات السوق UTC (Mon-Fri) — يغطّي الافتتاح صيفًا وشتاءً
concurrency:
  group: hand-flow
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # 🧊 خطة 025
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Harvest hand-flow
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HAND_COLLECT: "1"
        run: python hand_flow_collect.py
