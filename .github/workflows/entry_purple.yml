name: T-PURPLE (مرساة الطلبات البنفسجية)

# 🟣 العقد entry_purple_prereg.md (مدفوع قبل أي رقم · فحص بنية + حتمية).
# بحث/قياس فقط · يدوي بلا كرون · صفر مسّ إنتاج.
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      year:
        description: "السنة (2023 · 2024 · 2025) — الحكم يلزمه الثلاث"
        required: true
        default: ""
      frozen_run_id:
        description: "لقطة PIT: 2023=31574165523 · 2024=31199493957 · 2025=31191327731"
        required: true
        default: ""
jobs:
  entry_purple:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download frozen dataset
        uses: actions/download-artifact@v4
        with:
          name: frozen-dataset
          run-id: ${{ github.event.inputs.frozen_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run purple arms
        env:
          # 🔴 مدخل بلا env = مدخل ميت (قاعدة P1)
          BACKTEST_YEAR: ${{ github.event.inputs.year }}
          BT_FROZEN_PATH: frozen_backtest.pkl.gz
        run: python entry_purple_arms.py
