name: Cumulative Rise (📈🧮 قِس الرفعة التراكميّة)

# 🔒 قياسٌ بلا مساسِ فرزٍ ولا تلغرام. 🧾 **تحديثٌ مؤرَّخ 2026-08-18 (T-CUMRISE-FWD،
#    عقدُه `cumrise_fwd_prereg.md` مدفوعٌ قبل أوّل صفّ):** كرونان بعد إغلاق الافتر
#    يُلحقان صفَّ الجلسة بـ`cumrise_fwd_ledger.jsonl` (سجلُّ بحثٍ append-only —
#    نمطُ `hunter_ledger`) — **القياسُ نفسُه لم يتغيّر بحرف** (أقفال CR1-CR7).
permissions:
  contents: write   # لدفع سجلّ الحصاد وحده — والتشغيلُ اليدويّ بلا كتابة

on:
  schedule:
    - cron: "41 0 * * 2-6"   # بعد إغلاق الافتر صيفًا (00:00 UTC) — مُزاحٌ عن الصيّادين
    - cron: "41 1 * * 2-6"   # وشتاءً (01:00 UTC) — الدِدوبُ باليوم يمنع التكرار
  workflow_dispatch:
    inputs:
      day:
        description: "الجلسةُ المقيسة YYYY-MM-DD (فارغٌ = آخرُ جلسةٍ فيها بيانات)"
        required: false
        type: string

jobs:
  probe:
    # 🧊 **مُجمَّدٌ 2026-09-30:** Polygon انتهى بقرار المالك ⇒ شموعُ الدقيقة تعذّرت («0 من 515» · ‏36656869966 ⟵ خروج 2)
    #    فصار الجوبُ يدويًّا وحدَه (`CR8`). 🔥 **وفُكَّ 2026-10-29 بأمر المالك «فك تجميد pmfwd وcumrise»:** المفتاحُ عاد 2026-10-12
    #    (`polygon_health` ‏38237825537 ✅ · وتأكيدٌ 40583402044) ⇒ الكرونان يعملان كما قبل التجميد بلا `if` (`CRU1`) ·
    #    والجلساتُ 09-29…10-28 **لا تُستعاد**: الكونُ يُقرأ حيًّا (`_load_universe`) فتشغيلُ يومٍ ماضٍ يقيسه بكون اليوم ⟵ فجوةٌ مُعلَنة.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 📈🧮 قِس الرفعة التراكميّة
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          GATE_DAY: ${{ inputs.day }}
          CUMRISE_LEDGER: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python cumrise_probe.py

      - name: 🧾 دفعُ سجلّ الحصاد (المجدول وحده · fetch+rebase وإعادةُ محاولة)
        if: github.event_name == 'schedule'
        run: |
          if git diff --quiet -- cumrise_fwd_ledger.jsonl && \
             [ -z "$(git status --porcelain cumrise_fwd_ledger.jsonl)" ]; then
            echo "لا صفَّ جديدًا (دِدوب أو لا مادّة) — لا دفع."; exit 0
          fi
          git config user.name "super-stocks-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cumrise_fwd_ledger.jsonl
          git commit -m "cumrise fwd ledger $(date -u +%F)"
          for i in 1 2 3 4; do
            git fetch origin main && git rebase origin/main && \
              git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((2 ** i))
          done
          echo "⛔ تعذّر الدفعُ بعد 4 محاولات" && exit 1
