name: مراقبة الارتداد اللحظية

on:
  schedule:
    # كل 30 دقيقة: بريماركت + ساعات السوق + الأفتر (📉 رادار ضغط المضارب نمط LABT —
    # يلزم مفتاح Polygon). التشغيلات بلا مفتاح تنتهي رخيصةً. مُدّت 21→23 للأفتر.
    # ⚠️ **تصحيح 2026-07-28 (كان الوصف صيفيًّا فقط):** النوافذ تتصيّف/تتشتّى —
    #   صيفًا (EDT): بريماركت 08:00–13:30 · السوق 13:30–20:00 · الأفتر 20:00–24:00 UTC
    #   شتاءً (EST): بريماركت 09:00–14:30 · السوق 14:30–21:00 · الأفتر 21:00–**01:00**
    # ⇒ **آخر 77 دقيقة من الأفتر الشتوي (23:43→01:00 UTC) خارج التغطية.** مقصود
    #   الإبقاء: إضافة الساعة 0 لا-عمل مُثبَت (`polygon_after_hours` لا تفتح إلا بعد
    #   عتبة الإغلاق **من نفس يوم UTC**، فتشغيل 00:xx يقرأ يومًا جديدًا فارغًا).
    #   تغييرها يحتاج نقل حدود النافذة نفسها = قرار مالك لا تعديل جدولة.
    # 🔴 **تصحيحان مقاسان (2026-08-06، بإذن المالك) — وكلاهما يُسقط اعتقادًا كان هنا:**
    #
    # ① **«الدقيقة غير المستديرة تنقذ الفتحة» — مكذَّب.** يوم 2026-08-05 وصلت **‏7
    #    تشغيلات من 26 فتحة (‏27%)**، و**لا واحدة منها على الدقيقة 13 أو 43**:
    #    ‏13:02 · 15:27 · 17:10 · 18:55 · 20:39 · 21:56 · 23:17. فGitHub يؤخّر بمقدارٍ
    #    عشوائيّ ثم يُسقط، **واختيارُ الدقيقة لا يغيّر شيئًا** — يبقى `13,43` أساسًا
    #    لأن تغييره بلا فائدةٍ مقيسة، وتُضاف فتحاتٌ بينهما.
    #
    # ② **«مجموعةُ التزامن تُلغي التشغيلات» — مكذَّب أيضًا.** آخر 30 تشغيلة:
    #    **صفرُ `cancelled`** (‏29 نجاح · 1 فشل)، **ومدّةُ التشغيل وسيطُها 0.6 دقيقة**
    #    (أقصاها 9) ⇒ لا ازدحامَ ولا طوابيرَ أصلًا. فالعلّةُ **إسقاطُ الكرون** حصرًا.
    #
    # ⇒ **العلاجُ الوحيد المتاح بلا تغيير معمارية: مضاعفةُ الفتحات.** بمعدّل تسليمٍ
    #    ‏≈27% تعطي 52 فتحةً/يوم ‏≈14 تشغيلة ⇒ **وسيطُ الفاصل ‏~55د بدل 104د المقيسة**.
    #    والكلفةُ مهملة (0.6د للتشغيلة). ⚠️ **ولا يُدَّعى أنه حلٌّ كامل** — يُعاد قياسُ
    #    معدّل التسليم بعد ~أسبوع، فإن لم يتحسّن فالمخرجُ **جوبُ جلسةٍ طويل** كما في
    #    `ignition.yml` (النمطُ المُثبَت في المستودع لقناةٍ عالية التردّد).
    - cron: "13,43 11-23 * * 1-5"
    - cron: "28,58 11-23 * * 1-5"
  workflow_dispatch: {}

# مجموعة تزامن مشتركة مع daily_screener: كلاهما يكتب weekly_watchlist.json،
# فلا يعملان متزامنَين (يمنع تضارب git_save وفقدان حالة «triggered»).
concurrency:
  group: super-stocks-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor pullback list
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python pullback_live.py
