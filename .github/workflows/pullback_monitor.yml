name: مراقبة الارتداد اللحظية

on:
  schedule:
    # كل 30 دقيقة: بريماركت + ساعات السوق + الأفتر (📉 رادار ضغط المضارب نمط LABT —
    # يلزم مفتاح Polygon). التشغيلات بلا مفتاح تنتهي رخيصةً. مُدّت 21→23 للأفتر.
    # ⚠️ **تصحيح 2026-07-28 (كان الوصف صيفيًّا فقط):** النوافذ تتصيّف/تتشتّى —
    #   صيفًا (EDT): بريماركت 08:00–13:30 · السوق 13:30–20:00 · الأفتر 20:00–24:00 UTC
    #   شتاءً (EST): بريماركت 09:00–14:30 · السوق 14:30–21:00 · الأفتر 21:00–**01:00**
    # ⇒ **آخر 77 دقيقة من الأفتر الشتوي (23:43→01:00 UTC) خارج التغطية.** مقصود
    #   الإبقاء: إضافة الساعة 0 لا-عمل مُثبَت (`polygon_after_hours` لا تفتح إلا بعد
    #   عتبة الإغلاق **من نفس يوم UTC**، فتشغيل 00:xx يقرأ يومًا جديدًا فارغًا).
    #   تغييرها يحتاج نقل حدود النافذة نفسها = قرار مالك لا تعديل جدولة.
    # 🔴 **تصحيحان مقاسان (2026-08-06، بإذن المالك) — وكلاهما يُسقط اعتقادًا كان هنا:**
    #
    # ① **«الدقيقة غير المستديرة تنقذ الفتحة» — مكذَّب.** يوم 2026-08-05 وصلت **‏7
    #    تشغيلات من 26 فتحة (‏27%)**، و**لا واحدة منها على الدقيقة 13 أو 43**:
    #    ‏13:02 · 15:27 · 17:10 · 18:55 · 20:39 · 21:56 · 23:17. فGitHub يؤخّر بمقدارٍ
    #    عشوائيّ ثم يُسقط، **واختيارُ الدقيقة لا يغيّر شيئًا** — يبقى `13,43` أساسًا
    #    لأن تغييره بلا فائدةٍ مقيسة، وتُضاف فتحاتٌ بينهما.
    #
    # ② **«مجموعةُ التزامن تُلغي التشغيلات» — مكذَّب أيضًا.** آخر 30 تشغيلة:
    #    **صفرُ `cancelled`** (‏29 نجاح · 1 فشل)، **ومدّةُ التشغيل وسيطُها 0.6 دقيقة**
    #    (أقصاها 9) ⇒ لا ازدحامَ ولا طوابيرَ أصلًا. فالعلّةُ **إسقاطُ الكرون** حصرًا.
    #
    # ⇒ **العلاجُ الوحيد المتاح بلا تغيير معمارية: مضاعفةُ الفتحات.** بمعدّل تسليمٍ
    #    ‏≈27% تعطي 52 فتحةً/يوم ‏≈14 تشغيلة ⇒ **وسيطُ الفاصل ‏~55د بدل 104د المقيسة**.
    #    والكلفةُ مهملة (0.6د للتشغيلة). ⚠️ **ولا يُدَّعى أنه حلٌّ كامل** — يُعاد قياسُ
    #    معدّل التسليم بعد ~أسبوع، فإن لم يتحسّن فالمخرجُ **جوبُ جلسةٍ طويل** كما في
    #    `ignition.yml` (النمطُ المُثبَت في المستودع لقناةٍ عالية التردّد).
    #
    # 🎯 **توسيعٌ 2026-08-16 (‏11 ⟶ 8 UTC) — أمرُ المالك «متابعةٌ مستمرة … ويوصلني
    #    تحديثٌ مباشرة حسب دخول المضارب»، والسببُ مقيسٌ من صورته نفسِها:** حركةُ
    #    `WETO` التي بُنيت عليها ثلاثيةُ الدخول وقعت **مبكّرًا في البريماركت**
    #    (محورُ الشارت 04:47-05:22 نيويورك = **08:47-09:22 UTC صيفًا**)، والكرونُ
    #    كان يبدأ 11:13 UTC = **‏07:13 نيويورك** ⇒ **ثلاثُ ساعاتٍ من البريماركت
    #    خارجَ التغطية تمامًا**، وفيها بالضبط تقع اللحظةُ التي طلبها.
    #    ⚠️ والكلفةُ مقيسةٌ ومهملة: وسيطُ التشغيلة **0.6 دقيقة**، وثلاثُ ساعاتٍ
    #    إضافيةٍ = ‏12 فتحةً/يوم ⇒ ‏≈3 تشغيلاتٍ فعلية بمعدّل التسليم المقيس.
    # (قديم — للرجوع) - cron: "13,43 8-23 * * 1-5"
    # (قديم — للرجوع) - cron: "28,58 8-23 * * 1-5"

    # 🛟 **إصلاح 2026-08-31 — سُلّم تأخّر للكرون:** اليوم لم تصل أي فتحة من
    #    08:13→10:43 UTC، بينما رادار الانطلاق المقرر 02:11 لم يبدأ إلا 08:35
    #    (≈384د تأخّر). لذلك نزرع فتحات قبل النافذة؛ إن وصلت مبكرًا تُغلق بالبوابة
    #    أدناه بلا فحص أو تنبيه، وإن أخّرها GitHub عدة ساعات تهبط داخل 08–23 UTC.
    #    لا تغيير في شروط الأسهم أو الإرسال — جدولة فقط.
    # (قديم — للرجوع) - cron: "13 0,2,4,6 * * 1-5"
    # بذرة الاثنين ضد تأخّرٍ شديد يبدأ من مساء الأحد؛ الوصول الفوري يوم الأحد يُغلق.
    # (قديم — للرجوع) - cron: "13 22 * * 0"
    # ❄️ **الأفترُ الشتويّ حتى 01:00 UTC (أمرُ المالك 2026-11-04 «مدّ مراقبة الأفتر شتاءً حتى 01:00 — استعادة لنفس
    #    التغطية الصيفية لا إطالة»):** شتاءً الأفتر 21:00-01:00 UTC ⟵ ساعتُه الأخيرة في يوم UTC التالي (الثلاثاء-السبت) ·
    #    فتحاتٌ بإيقاع النافذة الأساسيّة نفسِه · **والبوّابةُ تفتحها في أفتر نيويورك وحدَه** (16:00-19:59 · الاثنين-الجمعة
    #    بتوقيت نيويورك) ⟵ صيفًا تصل 20:xx نيويورك فتُغلَق (لا تشغيلَ زائدٌ) · `AHW1`.
    # (قديم — للرجوع) - cron: "13,43 0 * * 2-6"
    # (قديم — للرجوع) - cron: "28,58 0 * * 2-6"
    # 🔁 **جوبُ جلسةٍ طويل (أمرُ المالك 2026-11-06 «حوّل المراقب لجوب جلسة طويل»):** الكروناتُ أعلاه (مُعلَّقةً بحرفها للرجوع)
    #    كانت تُسقطها GitHub (‏11-05: 4 تشغيلاتٍ من ‏≈56 فتحة · وصفرٌ من فتحات الأفتر الشتويّ ليلتين) ⟵ جوبٌ واحدٌ `session` يعيش طوالَ
    #    النافذة ويُشغّل **الدورةَ نفسَها** (`pullback_live.py`) على الدقائق نفسِها (13 · 28 · 43 · 58) وفي النوافذ نفسِها (`pullback_session.py`) ·
    #    ويُطلق خلَفَه قبل نهاية ميزانيّته · وهذي كروناتُ **بدءٍ واحتياط** لا فتحات: الأوّلُ يبدأ النافذة والباقي يلتقط سقوطَ الأوّل أو الخلَف
    #    (العاملُ الأحدث ينتظر احتياطًا ما دام أقدمُ حيًّا ⟵ ومنذ «زد كرونات البدء» 2026-11-06 يخرج فورًا إلّا عن أقدمَ في دقائقه الأخيرة) · `PBJ1`-`PBJ5`.
    #    ↩️ **الرجوع:** أعد الكرونات المُعلَّقة أعلاه (أزل «# (قديم — للرجوع) ») واحذف كرونات الجلسة هذي — وظيفةُ `monitor` القديمة باقيةٌ بحرفها.
    - cron: "1 8 * * 1-5"
    - cron: "31 10 * * 1-5"
    - cron: "1 13 * * 1-5"
    - cron: "1 16 * * 1-5"
    - cron: "1 19 * * 1-5"
    - cron: "1 22 * * 1-5"
    # ⏰ **كرونُ بدءٍ كلَّ ساعة (أمرُ المالك 2026-11-06 «زد كرونات البدء»):** GitHub أسقط 08:01 و10:31 يومَها ⟵ الساعاتُ الباقية من 08-23 UTC
    #    بسطرٍ واحد · والعاملُ يخرج فورًا إن وجد عاملًا أقدمَ حيًّا (`pullback_session.STANDBY_ON_OLDER` · `PBJ5`) ·
    #    والشرطان أدناه يحدّدان الجوبَ بالكرونات القديمة المُعلَّقة لا بكرونات الجلسة ⟵ إضافةُ كرون بدءٍ أو حذفُه لا تمسّهما.
    #    ↩️ **الرجوع: احذف السطرَ التالي.**
    - cron: "1 9-12,14,15,17,18,20,21,23 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "session = جوبُ الجلسة (الافتراض) · once = دورةٌ واحدة بالوظيفة القديمة"
        required: false
        default: "session"
      budget:
        description: "دقائقُ جوب الجلسة (فحصُ دخان — يُقصّر ولا يُطيل · السقف 330)"
        required: false
        default: ""

# مجموعة تزامن مشتركة مع daily_screener: كلاهما يكتب weekly_watchlist.json،
# فلا يعملان متزامنَين (يمنع تضارب git_save وفقدان حالة «triggered»).
permissions:
  contents: write

jobs:
  # 🔁 الوظيفةُ القديمة بحرفها — للرجوع (الكروناتُ المُعلَّقة أعلاه) ولـ`mode=once` · وتبقى في مجموعة الحالة (`CY4`).
  monitor:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'once')
          || (github.event_name == 'schedule'
              && contains(fromJSON('["13,43 8-23 * * 1-5","28,58 8-23 * * 1-5","13 0,2,4,6 * * 1-5","13 22 * * 0","13,43 0 * * 2-6","28,58 0 * * 2-6"]'),
                          github.event.schedule)) }}
    concurrency:
      group: super-stocks-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delay-ladder window gate
        id: gate
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          run=1
          if [[ "$SCHEDULE" == "13 0,2,4,6 * * 1-5" || "$SCHEDULE" == "13 22 * * 0" ]]; then
            hour=$((10#$(date -u +%H)))
            dow=$(date -u +%u)
            # فتحات السُلّم لا تفحص بياناتٍ بايتة: تعمل فقط داخل نافذة المراقبة
            # الفعلية وفي يوم عمل UTC. وصولها مبكرًا = نجاح رخيص بلا أي تنبيه.
            if (( hour < 8 || hour > 23 || dow > 5 )); then
              run=0
            fi
          fi
          # ❄️ فتحاتُ الأفتر الشتويّ: تعمل في أفتر نيويورك وحدَه (16:00-19:59 · الاثنين-الجمعة بتوقيت نيويورك)
          if [[ "$SCHEDULE" == "13,43 0 * * 2-6" || "$SCHEDULE" == "28,58 0 * * 2-6" ]]; then
            nyh=$((10#$(TZ=America/New_York date +%H)))
            nyd=$(TZ=America/New_York date +%u)
            if (( nyh < 16 || nyh > 19 || nyd > 5 )); then
              run=0
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "delay-ladder gate: run=$run schedule='$SCHEDULE' utc=$(date -u +%FT%TZ)"

      - name: Checkout
        if: steps.gate.outputs.run == '1'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.gate.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # 🧊 خطة 025

      - name: Install dependencies
        if: steps.gate.outputs.run == '1'
        run: pip install -r requirements.txt

      - name: Monitor pullback list
        if: steps.gate.outputs.run == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          # 📺 شموعُ البوت من TradingView (أمرُ المالك 2026-09-30 · `bars_source`) — المصدرُ نفسُه الذي حُسبت عليه المستويات ·
          #    وياهو احتياطٌ لكلّ رمزٍ يتعذّر · ⚠️ بيانُ الزائر متأخّرٌ ‏≈15 دقيقة داخل الجلسة · وحذفُ السطر = ياهو بت-بت.
          BARS_SOURCE: tradingview
        run: python pullback_live.py

  # 🔁 جوبُ الجلسة (أمرُ المالك 2026-11-06): خارج مجموعة الحالة (5.5 ساعة فيها تحجز تجديدَ الجمعة) والحمايةُ داخل الحلقة (`state_busy`) ·
  #    كلُّ دورةٍ `pullback_live.py` نفسُه على main طازج · والخلَفُ بـ`GITHUB_TOKEN` (`actions: write`) · `PBJ1`-`PBJ4`.
  session:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.mode != 'once')
          || (github.event_name == 'schedule'
              && !contains(fromJSON('["13,43 8-23 * * 1-5","28,58 8-23 * * 1-5","13 0,2,4,6 * * 1-5","13 22 * * 0","13,43 0 * * 2-6","28,58 0 * * 2-6"]'),
                           github.event.schedule)) }}
    concurrency:
      group: super-stocks-pullback-session-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 345          # فوق ميزانيّة السكربت (330) بهامشٍ للدورة الأخيرة
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🔁 جوبُ جلسة المراقب
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          BARS_SOURCE: tradingview
          PB_BUDGET_MIN: ${{ github.event.inputs.budget }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: python pullback_session.py

