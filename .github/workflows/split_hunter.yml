name: Split Hunter (صيّاد المقسّم)
# 🪝 أداة مستقلة عن فارز الارتكاز: تمسح ناسداك بعد الإغلاق عن مقسّم عكسي يطابق setup
# فيصل الصارم (مقسّم + وصل القمة÷2 + حافظ 3ج + فلوت<2م + خالٍ من قروب) وترسله لتلغرام.
# صامتة لو لا مطابق. عرض/تنبيه فقط — لا تمسّ حالة/فرز/LOGIC_VERSION.
on:
  schedule:
    # ⏰ **بعد إغلاق الافتر** (طلب المالك 2026-07-27: «نهاية كل يوم بعد إغلاق الافتر»).
    # الافتر يمتدّ 16:00→20:00 ET، و20:00 ET = 00:00 UTC صيفًا (EDT) و01:00 UTC شتاءً
    # (EST) — **في اليوم التالي بتوقيت UTC**. فـ01:13 UTC يقع بعد الإغلاق بالفصلين
    # (21:13 EDT صيفًا · 20:13 EST شتاءً). الكرون السابق (22:17 UTC = 18:17 ET) كان
    # **أثناء** الافتر لا بعده.
    # ⚠️ خانة الأيام **2-6 (ثلاثاء→سبت)** لا 1-5: جلسة الاثنين ET ينتهي افترها فجر
    #    الثلاثاء UTC، وجلسة الجمعة فجر السبت UTC. تغييرها معًا إلزامي.
    # دقيقة غير مستديرة (13) تقلّل تأخّر GitHub الموثّق (التأخّر يؤجّل فقط ولا يُبكّر،
    # فلا يعيدنا داخل الافتر).
    - cron: "13 1 * * 2-6"
  workflow_dispatch: {}
jobs:
  split-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run split hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python split_hunter.py
