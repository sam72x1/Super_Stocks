name: TV Probe (مِجَسّ TradingView — مؤقّت)

# 🔐 أقلّ صلاحية: قراءةٌ فقط · لا تلغرام · لا سرّ · لا كتابةَ حالة.
# 🧪 مِجَسٌّ مؤقّت (2026-09-29 · أمرُ المالك «البيانات تاخذها من ترندق فيو مب ياهو»): هل تصل رنراتُ GitHub إلى ماسح
# TradingView ومِقبس شموعه؟ وكم تستغرق؟ وهل يطابق RSI الماسح حسابَنا؟ — **يُحذف بعد قراءة سجلّه** (نمطُ المِجَسّات السابقة).
permissions:
  contents: read

on:
  workflow_dispatch: {}
  push:                      # يعمل من الفرع مباشرةً عند دفع ملفّاته (لا دمجَ في main لمِجَسٍّ مؤقّت)
    branches: [claude/conversation-compaction-failure-088pki]
    paths: [tv_probe.py, tv_data.py, .github/workflows/tv_probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TradingView probe
        run: python tv_probe.py
