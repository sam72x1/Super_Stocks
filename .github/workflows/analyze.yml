name: Manual Stock Analysis

# 🔐 أقلّ صلاحية (تدقيق 2026-07-28، خطة `plans/010`): تحليل سهم واحد: analyze_one.py عرض فقط.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Stock ticker to analyze (e.g. VOR)
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run on-demand analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANALYZE: ${{ github.event.inputs.ticker }}
        run: python analyze_one.py
