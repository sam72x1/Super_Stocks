name: Operator Entry (🎯 هنا الدخول — عاملُ جلسةٍ حيّ)

# 🔐 يكتب ملفَّ الدِدوب وحدَه (`op_entry_state.json`) — لا يمسّ قائمةً ولا فرزًا.
# 🔗 و`actions: write` **لإطلاق خلَفِه** (`workflow_dispatch` عبر GITHUB_TOKEN —
#    الاستثناءُ الوحيد الذي يسمح به GitHub لتوليد تشغيلةٍ من داخل تشغيلة)؛
#    بلاغُ المالك 2026-09-02: كرونا `pre`/`open` سقطا يوم 08-28 فغاب العاملُ
#    من 01:12 إلى 18:32 UTC (‏17 ساعة). انظر `_maybe_chain` في `operator_entry_live.py`.
#    🧪 مُثبَتٌ حيًّا 2026-09-02: تشغيلة 33643759113 أطلقت 33643801039 خلال ثانيتين
#    (أوّلُ مسحٍ مكتملٍ للخلَف بعد ‏≈75 ثانية)، والخلَفُ رأى الأحياءَ فلم يُطلق رابعًا.
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      segment:
        description: "المقطع: pre / open / post"
        required: false
        type: string
      interval:
        description: "ثوانٍ بين الدورات (افتراضي 60)"
        required: false
        type: string
      budget:
        description: "دقائقُ العمل (فحصُ دخان — يُقصّر ولا يُطيل)"
        required: false
        type: string
      chain_test:
        description: "1 = فحصُ دخانِ الخلَف: يُطلق خلَفًا بميزانيةِ دقيقةٍ فورًا"
        required: false
        type: string
  schedule:
    # ⏰ **الكرونُ مُقدَّمٌ بمقدار تأخّر GitHub المقيس** (‏95-152 دقيقة · وسيط
    #    ‏≈119) — نفسُ علاج `ignition.yml` و`daily_screener.yml` المدوَّن.
    #    الأهدافُ **بتوقيت نيويورك** (المصدرُ يتصيّف/يتشتّى ذاتيًّا فلا يتعفّن):
    #      · `pre`  ⟵ 04:00 نيويورك (بدءُ البريماركت) = 08:00 UTC صيفًا
    #      · `open` ⟵ 09:30 نيويورك (الجرس)          = 13:30 UTC صيفًا
    #      · `post` ⟵ 15:00 نيويورك (قبيل الإغلاق)   = 19:00 UTC صيفًا
    #    ⚠️ **وهذا تقريبٌ لا ضمان:** التأخّرُ متغيّرٌ، والمقاطعُ تتداخل عمدًا
    #    (‏5.5 ساعةٍ لكلٍّ) فلا تُفتَح فجوةٌ عند الجرس · والدِدوبُ يمنع التكرار.
    #    والمراقبُ الدوريّ (كلَّ 15د) يبقى **شبكةَ أمان** لِما يُسقطه الكرون.
    - cron: "1 6 * * 1-5"     # ⟶ pre
    - cron: "31 11 * * 1-5"   # ⟶ open
    - cron: "1 17 * * 1-5"    # ⟶ post
    # 🔴🔴 **ثلاثةُ كرونات احتياط — أمرُ المالك 2026-08-28** («طول جلسة التداول
    #    ما كان واصلني اي اشعار»). **والعطبُ مقيسٌ من سجلّ التشغيلات لا مُخمَّن:**
    #    يوم 2026-08-28 أنتج هذا الـworkflow ثلاثَ تشغيلاتٍ فقط — ‏01:12 UTC
    #    (‏22 ثانية: خرجت بحارس «لا جلسة») ثم **‏18:32** ثم 21:27 ⇒ **كرونا
    #    `pre` و`open` لم يُنتجا تشغيلةً إطلاقًا** ⇒ **صفرُ عاملٍ حيٍّ من 01:13
    #    إلى 18:32 UTC** = البريماركتُ كلُّه وأوّلُ خمسِ ساعاتٍ من الجلسة.
    #    (وGitHub يُسقط تشغيلاتِ الكرون تحت الحمل — موثَّقٌ عندنا منذ 2026-07-28.)
    # ⚖️ **ولماذا كرونٌ إضافيٌّ لا عتبةٌ ولا كود:** `OE_SEGMENT` **وسمُ سجلٍّ
    #    فقط** — نافذةُ العمل تُحسَب من **ساعة نيويورك الحيّة** حتى 20:00
    #    (`_ny_minutes` + `_budget`) ⇒ أيُّ وقتِ إطلاقٍ صالحٌ بنيويًّا.
    #    والتداخلُ آمنٌ ومقصودٌ سلفًا: الدِدوبُ في `op_entry_state.json`،
    #    والعاملُ **يُعيد قراءةَ أختام المقاطع الأخرى** كلَّ `REFRESH_EVERY`
    #    دورة (`seen.setdefault`) فلا تتكرّر رسالةٌ · و`concurrency` مفتاحُها
    #    `github.event.schedule` فلا يُلغي كرونٌ آخر.
    - cron: "21 8 * * 1-5"    # ⟶ pre-b  (احتياطُ البريماركت)
    - cron: "21 13 * * 1-5"   # ⟶ open-b (احتياطُ الجرس)
    - cron: "21 18 * * 1-5"   # ⟶ post-b (احتياطُ ما قبل الإغلاق)

    # 🛟 **إصلاح 2026-08-31 — سُلّم تأخّر:** رادار الانطلاق المقرر 02:11 UTC
    #    بدأ اليوم 08:35 (≈384د تأخّر)، بينما تشغيلات هذا العامل المبكرة لم تصل.
    #    نضيف فتحات أسبق؛ إن وصلت قبل جلسة نيويورك يخرج السكربت بحارس «لا جلسة»،
    #    وإن أخّرها GitHub تهبط داخل البريماركت/السوق وتتحول إلى عامل حي كامل.
    #    نفس منطق الدخول ونفس الدِدوب — لا تغيير في شروط الأسهم أو الرسائل.
    - cron: "21 0,2,4 * * 1-5" # ⟶ delay-ladder
    # بذرة مساء اليوم السابق؛ مفيدة خصوصًا للاثنين عند تأخّر شديد (~10س).
    - cron: "21 22 * * 0-4"    # ⟶ prev-day seed

# مجموعةُ تزامنٍ مستقلّة: لا يكتب قائمةَ الفرز فلا يزاحم `super-stocks-state`.
# 🔗 والخلَفُ (dispatch) مجموعتُه **معرِّفُ تشغيلته** فلا يقف في طابور سلفه:
#    يبدأ وسلفُه ما زال يعمل دقائقَه الأخيرة ⇒ تداخلٌ لا فجوة (كان `manual`
#    مجموعةً واحدة ⇒ الخلَفُ ينتظر انتهاءَ السلف = فجوةُ دقيقةٍ أو أكثر).
concurrency:
  group: super-stocks-operator-entry-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 345          # فوق سقف السكربت (330) بهامشٍ للإنهاء
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run operator-entry watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          OE_SEGMENT: >-
            ${{ github.event.inputs.segment
                || (github.event.schedule == '1 6 * * 1-5' && 'pre')
                || (github.event.schedule == '31 11 * * 1-5' && 'open')
                || (github.event.schedule == '1 17 * * 1-5' && 'post')
                || (github.event.schedule == '21 8 * * 1-5' && 'pre-b')
                || (github.event.schedule == '21 13 * * 1-5' && 'open-b')
                || (github.event.schedule == '21 18 * * 1-5' && 'post-b')
                || (github.event.schedule == '21 0,2,4 * * 1-5' && 'delay-ladder')
                || (github.event.schedule == '21 22 * * 0-4' && 'prev-day-seed')
                || 'manual' }}
          OE_INTERVAL: ${{ github.event.inputs.interval }}
          OE_BUDGET_MIN: ${{ github.event.inputs.budget }}
          OE_CHAIN_TEST: ${{ github.event.inputs.chain_test }}
          # 🌙⏱️ قائمةُ ما قبل الجلسة — **البريماركتُ وحدَه** بأمر المالك
          #    «شغّل البريماركت» (2026-09-03). الافترُ يبقى صامتًا يكتب السجلَّ
          #    الأماميّ (رافعتُه المقيسة ‏4.2× مقابل 29.8×). تُقبل `PM,AH` أو `1`.
          PRESESSION_SEND: PM
          GITHUB_TOKEN: ${{ github.token }}
        run: python operator_entry_live.py
