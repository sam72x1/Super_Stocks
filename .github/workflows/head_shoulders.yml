name: "🔎 نموذج الرأس والكتفين (head_and_shoulders_detector · hs_prereg)"

# 🔎 أمرُ المالك 2026-10-01 «FULL AUTONOMOUS MISSION — BUILD: نموذج الرأس والكتفين» · العقد hs_prereg.md.
# الأوضاع: dev (2022 أعمى عن العوائد ‏+ عيّنةُ التدقيق ‏+ التحقّقُ البنيويّ) · verdict (الحكمُ المسجَّل 2023-2025 ‏+ 5 دقائق وصفيّة)
#   · ticker (فحصُ سهمٍ ‏+ شارت) · query (الحالاتُ التاريخيّة ‏+ CSV) · scan (المسحُ الحيّ — مجدولٌ منذ 2026-10-01 بعد الحكم وبشرط دقّة التدقيق · العقد §⑪ · HS25).
# 📺 الشموعُ من TradingView مباشرةً (`S.tv_download`) — **بلا `BARS_SOURCE`** (مفتاحُه محصورٌ بعشرة workflows · قفلُ TVB9).
# 🔐 contents: write — `git_save` يدفع `hs_research/` (dev/verdict) و`hs_state.json` (scan). خارج الفرز والجذور · لا `LOGIC_VERSION`.
permissions:
  contents: write

on:
  schedule:
    # ⏰ المسحُ اليوميّ بعد الإغلاق (العقد §⑪ · بعد الحكم وبشرط الدقّة): 00:47 UTC = 20:47 ET صيفًا · 19:47 ET شتاءً — بعد إغلاق
    #    الجلسة النظاميّة في الفصلين · وخانةُ الأيّام 2-6 (ثلاثاء⟶سبت UTC = جلساتُ الاثنين⟶الجمعة).
    - cron: "47 0 * * 2-6"
  workflow_dispatch:
    inputs:
      mode:
        description: "dev · verdict · ticker · query · scan"
        type: choice
        options: [dev, verdict, ticker, query, scan]
        # الافتراضيُّ query (يقرأ ولا يكتب البحث) — dev/verdict يُختاران صراحةً فلا يدهس تشغيلٌ يدويٌّ عابرٌ ملفّاتِ البحث المجمَّدة
        default: query
      ticker:
        description: "الرمز (لوضع ticker)"
        required: false
        default: ""
      tf:
        description: "الفريم (لوضع ticker): 1d · 5m"
        type: choice
        options: ["1d", "5m"]
        default: "1d"

concurrency:
  # الكتّابُ (dev · verdict · scan · المجدول) يتسلسلون في مجموعة الحالة · وticker/query **قراءةٌ لا تكتب** فمجموعتُهما بمعرّف التشغيلة:
  # GitHub يُبقي في المجموعة الواحدة **معلَّقًا واحدًا** ويُلغي ما قبله — عطلٌ مُثبَت 2026-10-01: فحصُ BNGO `36920013978` أُلغي
  # لأن طلبًا بعده دخل المجموعةَ نفسَها · فلا يُلغي طلبٌ طلبًا ولا يُلغي طلبٌ المسحَ المجدول (HS40).
  group: >-
    ${{ (inputs.mode == 'ticker' || inputs.mode == 'query')
        && format('head-shoulders-read-{0}', github.run_id)
        || 'head-shoulders' }}
  cancel-in-progress: false

jobs:
  hs:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🔎 نموذج الرأس والكتفين
        env:
          PYTHONUNBUFFERED: "1"
          HS_MODE: ${{ inputs.mode || 'scan' }}
          HS_TICKER: ${{ inputs.ticker }}
          HS_TF: ${{ inputs.tf }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python head_shoulders.py
