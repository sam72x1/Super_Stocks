name: GEN5 ext fetch (research · one-off · no Telegram)

# 🧬🔍 GEN5 addendum 1 (fm_forensics/gen5/GEN5_ADDENDUM_1.md): the extended-session bars (pre-market + regular + after-hours,
#    split-adjusted) come from TradingView, which this session's container cannot reach (egress 403) ⟵ fetched here once.
#    Push-triggered on the session branch only when the symbol list changes · writes fm_forensics/gen5/data/gen5_ext.json.gz
#    and pushes it back (a GITHUB_TOKEN push starts no new run) · reads nothing secret · sends nothing · deleted after use.
permissions:
  contents: write

on:
  push:
    branches: [claude/conversation-compaction-failure-088pki]
    paths: [fm_forensics/gen5/data/ext_symbols.txt]

concurrency:
  group: gen5-ext-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch extended-session bars
        run: python3 fm_forensics/gen5/gen5_ext.py

      - name: Commit the data file to the same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fm_forensics/gen5/data/gen5_ext.json.gz
          git commit -m "GEN5 addendum 1: extended-session bars from TradingView (runner fetch)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
