name: "📈✖️③➕ T-EMA3 الملحق 1 — تقاطع إيما بعد اختبار القاع (قراءةٌ وتحليل · بلا تلغرام)"

# أمرُ المالك 2026-11-21 · العقد fm_forensics/ema3/T_EMA3_ADDENDUM_1.md (مسجَّلٌ بعد رؤية أرقام) · قراءةٌ وتحليلٌ فقط.
# يدويٌّ بلا كرون · لا تلغرام · لا Polygon · لا جلبَ جديد: يقرأ مادّةَ T-EMA3 المجلوبة (artifact التشغيلتين) · والمخرجاتُ بياناتٌ تحت fm_forensics/ema3/out/.
permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "discover (2023-2025) ثمّ confirm (2026 · مرّةً واحدة بعد الاكتشاف)"
        required: true
        default: "discover"

concurrency:
  group: super-stocks-ema3
  cancel-in-progress: false

jobs:
  run:
    if: ${{ inputs.stage == 'discover' || inputs.stage == 'confirm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 🔒 PYV1
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ema3-data-${{ inputs.stage }}
          path: ema3_data
          run-id: ${{ inputs.stage == 'discover' && '44888937080' || '44890468806' }}   # مادّةُ T-EMA3 المجلوبة نفسُها — العقد §⑦
          github-token: ${{ github.token }}
      - name: 🧮 الملحق 1 — ${{ inputs.stage }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python fm_forensics/ema3/ema3_retest.py run ${{ inputs.stage }} --dir ema3_data | tee ema3_retest_${{ inputs.stage }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ema3-retest-out-${{ inputs.stage }}
          path: |
            fm_forensics/ema3/out/
            ema3_retest_${{ inputs.stage }}.log
          retention-days: 90
      - name: 💾 إيداعُ المخرجات (بياناتٌ لا كود)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d fm_forensics/ema3/out ]; then git add -f fm_forensics/ema3/out; fi
          if git diff --cached --quiet; then echo "لا جديد"; exit 0; fi
          git commit -q -m "📈 T-EMA3 الملحق 1 بيانات: ${{ inputs.stage }}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin "$GITHUB_REF_NAME" && git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
            sleep 5
          done
          exit 1
